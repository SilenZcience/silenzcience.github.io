<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tetris High Score</title>
  <meta name="description" content="Check out my Tetris high score">
  <meta name="theme-color" content="#141413">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23141413'/%3E%3Crect x='10' y='10' width='44' height='44' fill='none' stroke='%23BC9C62' stroke-width='5'/%3E%3Ccircle cx='43' cy='43' r='7' fill='%23BC9C62'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141413;
      --bg-2: #1B1B19;
      --ink: #EDEBE6;
      --dim: #908E86;
      --faint: #5F5D57;
      --accent: #BC9C62;
      --line: rgba(237,235,230,0.08);
      --line-2: rgba(237,235,230,0.22);
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", "Courier New", monospace;
      --sheen-peak: 0.05;
      --scoreglow-peak: 0.11;
      --celflare-peak: 0.5;
      --celflash-peak: 0.5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }
    .card { width: 100%; max-width: 520px; }
    .svg-card {
      width: 100%; height: auto; display: block;
      border: 1px solid var(--line-2);
      background: radial-gradient(120% 120% at 50% 0%, var(--bg-2) 0%, var(--bg) 100%);
      box-shadow: 0 40px 80px -60px rgba(188, 156, 98, 0.4);
    }
    .play-btn {
      display: block; width: 100%;
      margin-top: 14px; padding: 14px 17px;
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: .16em; text-transform: uppercase;
      color: var(--dim); background: none;
      border: 1px solid var(--line-2);
      text-align: center; text-decoration: none;
      cursor: pointer; user-select: none; -webkit-user-select: none;
      transition: background .2s ease, color .2s ease, border-color .2s ease;
    }
    .play-btn:hover {
      background: var(--ink); color: var(--bg); border-color: var(--ink);
    }
    @keyframes scoreGlow {
      0%, 100% { opacity: .04; }
      50%      { opacity: var(--scoreglow-peak); }
    }
    @keyframes sheen {
      0%       { transform: translateX(-160px); opacity: 0; }
      12%      { opacity: var(--sheen-peak); }
      50%      { opacity: var(--sheen-peak); }
      88%      { opacity: 0; }
      100%     { transform: translateX(560px); opacity: 0; }
    }
    @keyframes fallT {
      0%   { transform: translateY(-230px); opacity: 0; }
      3%   { transform: translateY(-230px); opacity: 1; }
      62%  { transform: translateY(0); opacity: 1; }
      90%  { transform: translateY(0); opacity: 1; }
      92%  { transform: translateY(0); opacity: 0; }
      93%  { transform: translateY(-230px); opacity: 0; }
      100% { transform: translateY(-230px); opacity: 0; }
    }
    .score-glow { animation: scoreGlow 6s ease-in-out infinite; }
    .sheen      { animation: sheen 11s ease-in-out infinite; }
    .fall-t     { animation: fallT 2.6s cubic-bezier(.45,.05,.55,.95) infinite; }
    /* -- the landing chain: piece lands at 62%% of the 2.6s cycle, then
       shake -> squash -> floor slam -> shockwave -> cell ripple fires,
       every effect keyed off that one moment.                           */
    .board-shake { animation: shakeHit 2.6s ease-out infinite; }
    .stack       { transform-box: fill-box; transform-origin: 50% 100%;
                   animation: squash 2.6s ease-out infinite; }
    .stack rect  { transform-box: fill-box; transform-origin: center;
                   animation: cellHit 2.6s linear infinite;
                   animation-delay: var(--d, 0s); }
    .land-hit    { transform-box: fill-box; transform-origin: 50% 100%;
                   animation: pieceHit 2.6s ease-out infinite; }
    .trail       { filter: blur(1.5px);
                   animation: trailFade 2.6s linear infinite; }
    .marker      { transform-box: fill-box; transform-origin: center;
                   animation: markerPulse 1.3s ease-in-out infinite,
                              markerHide 2.6s ease-in-out infinite; }
    .slam        { transform-box: fill-box; transform-origin: 100% 50%;
                   animation: slam 2.6s ease-out infinite; }
    .board-flare { animation: flarePop 2.6s ease-out infinite; }
    .ring, .flash, .fx-spark { transform-box: fill-box; transform-origin: center; }
    .ring        { animation: ringPop 2.6s ease-out infinite; }
    .flash       { animation: flashPop 2.6s ease-out infinite; }
    .fx-spark    { animation: sparkPop 2.6s ease-out infinite; }
    @keyframes shakeHit {
      0%, 61%, 74%, 100% { transform: translate(0, 0); }
      63%    { transform: translate(1.6px, -1.2px); }
      65.5%  { transform: translate(-1.6px, 1px); }
      68%    { transform: translate(1px, -0.6px); }
      70.5%  { transform: translate(-0.6px, 0.5px); }
      73%    { transform: translate(0.3px, -0.2px); }
    }
    @keyframes squash {
      0%, 61%  { transform: translateY(0) scaleY(1); }
      63.5%    { transform: translateY(1.6px) scaleY(.945); }
      67%      { transform: translateY(0) scaleY(1.015); }
      71%, 100%{ transform: translateY(0) scaleY(1); }
    }
    @keyframes pieceHit {
      0%, 61%  { transform: translateY(0) scaleY(1); }
      63%      { transform: translateY(1.2px) scaleY(.9); }
      67%      { transform: translateY(0) scaleY(1.03); }
      71%, 100%{ transform: translateY(0) scaleY(1); }
    }
    @keyframes slam {
      0%, 61%    { opacity: 0; transform: scaleX(.06); }
      62.5%      { opacity: .95; transform: scaleX(.4); }
      70%        { opacity: .5; transform: scaleX(1); }
      80%, 100%  { opacity: 0; transform: scaleX(1.05); }
    }
    @keyframes ringPop {
      0%, 61.5% { opacity: 0; transform: scale(.35); }
      63%       { opacity: .95; transform: scale(.7); }
      74%       { opacity: .5; transform: scale(3); }
      85%, 100% { opacity: 0; transform: scale(4.4); }
    }
    @keyframes flashPop {
      0%, 61.5% { opacity: 0; transform: scale(.3); }
      63%       { opacity: .9; transform: scale(1); }
      69%       { opacity: .35; transform: scale(1.6); }
      76%, 100% { opacity: 0; transform: scale(2); }
    }
    @keyframes sparkPop {
      0%, 61%   { opacity: 0; transform: translate(0, 0) scale(.5); }
      63%       { opacity: 1; transform: translate(0, 0) scale(1); }
      74%       { opacity: 1; transform: translate(calc(var(--dx) * .5), calc(var(--dy) * .5)) scale(1.15); }
      86%, 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.4); }
    }
    @keyframes flarePop {
      0%, 61%   { opacity: 0; }
      63%       { opacity: .5; }
      76%, 100% { opacity: 0; }
    }
    @keyframes cellHit {
      0%     { opacity: .7; transform: scale(1); filter: none; }
      2.5%   { opacity: 1; transform: scale(1.14);
               filter: brightness(2.3) drop-shadow(0 0 3px rgba(247,232,200,.85)); }
      5.5%   { opacity: .78; transform: scale(1); filter: none; }
      100%   { opacity: .7; transform: scale(1); filter: none; }
    }
    @keyframes markerPulse {
      0%, 100% { opacity: .16; }
      50%      { opacity: .5; }
    }
    /* blink the projections out the instant the piece plants — the landing
       squash/shake would otherwise uncover the top one; back at 93% when
       the piece resets off-screen (hidden underneath while shrinking) */
    @keyframes markerHide {
      0%, 61.5%  { transform: scale(1); }
      62.5%, 92% { transform: scale(0); }
      93%, 100%  { transform: scale(1); }
    }
    /* streak builds while the piece accelerates, vanishes the instant it lands */
    @keyframes trailFade {
      0%, 4%   { opacity: 0; }
      12%      { opacity: .45; }
      30%      { opacity: .65; }
      56%      { opacity: 1; }
      62%, 100%{ opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .score-glow, .sheen, .fall-t, .trail, .board-shake, .stack,
      .land-hit, .marker, .slam, .board-flare, .ring, .flash, .fx-spark { animation: none; }
      .stack rect { animation: none; }
    }
  </style>
</head>

  <script src="../share-utils.js"></script>
  <script>
    (function () {
      function getParam(name) {
        var url = new URL(window.location.href);
        return url.searchParams.get(name);
      }
      var username = getParam('username') || 'Anonymous';
      var highscore = getParam('highscore') || '0';
      var lines = getParam('lines') || '';
      var token = getParam('t');
      if (token) {
        try {
          var data = deobfuscateShare(token);
          if (data && typeof data.n !== 'undefined' && typeof data.s !== 'undefined') {
            username = String(data.n).slice(0, 60);
            highscore = String(data.s);
            if (typeof data.l !== 'undefined') lines = String(data.l);
          }
        } catch (e) {}
      }
      var userText = document.getElementById('userText');
      var scoreText = document.getElementById('scoreText');
      var linesText = document.getElementById('linesText');
      if (scoreText) {
        scoreText.textContent = Number(highscore).toLocaleString();
        // Keep the score string clear of the Player column if it gets wide.
        var fs = 52, minFs = 30, boxW = 224;
        scoreText.setAttribute('font-size', String(fs));
        while (scoreText.getComputedTextLength() > boxW && fs > minFs) {
          fs -= 0.5; scoreText.setAttribute('font-size', String(fs));
        }
      }
      if (linesText) {
        var lNum = String(lines).replace(/[^0-9]/g, '');
        linesText.textContent = lNum ? String(parseInt(lNum, 10)) : '—';
        var lSize = 22, lBox = 96;
        linesText.setAttribute('font-size', String(lSize));
        var lGuard = 0;
        while (linesText.getComputedTextLength() > lBox && lSize > 12 && lGuard++ < 50) {
          lSize -= 0.5; linesText.setAttribute('font-size', String(lSize));
        }
      }
      if (userText) {
        var boxWidth = 380;
        var baseSize = 22, minSize = 11;
        var fitName = function () {
          var name = username;
          var fontSize = baseSize;
          userText.textContent = name;
          userText.setAttribute('font-size', String(fontSize));
          var guard = 0;
          while (userText.getComputedTextLength() > boxWidth && fontSize > minSize && guard++ < 100) {
            fontSize -= 0.5;
            userText.setAttribute('font-size', String(fontSize));
          }
          if (userText.getComputedTextLength() > boxWidth) {
            // Minimum size reached and the name still overflows.  The display
            // font is proportional, so a fixed per-character width guess is
            // wrong -- wide uppercase glyphs overrun it.  Measure the real
            // rendered width of each candidate until it actually fits.
            var n = name.length, k = 0;
            while (n > 1 && k++ < 200) {
              n -= 1;
              var candidate = name.slice(0, n) + '…';
              userText.textContent = candidate;
              if (userText.getComputedTextLength() <= boxWidth) break;
            }
            userText.textContent = name.slice(0, n) + '…';
          }
        };
        fitName();
        // Re-fit once the webfont really is loaded: measuring before that
        // uses the fallback font, so getComputedTextLength() can lie.
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(fitName);
        }
      }
    })();
  </script>
</body>
</html>
