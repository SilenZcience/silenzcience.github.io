<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake High Score</title>
  <meta name="description" content="Check out my Snake high score">
  <meta name="theme-color" content="#141413">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23141413'/%3E%3Crect x='10' y='10' width='44' height='44' fill='none' stroke='%23BC9C62' stroke-width='5'/%3E%3Ccircle cx='43' cy='43' r='7' fill='%23BC9C62'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141413;
      --bg-2: #1B1B19;
      --ink: #EDEBE6;
      --dim: #908E86;
      --faint: #5F5D57;
      --accent: #BC9C62;
      --line: rgba(237,235,230,0.08);
      --line-2: rgba(237,235,230,0.22);
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", "Courier New", monospace;
      --sheen-peak: 0.05;
      --scoreglow-peak: 0.11;
      --celflare-peak: 0.5;
      --celflash-peak: 0.5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .card { width: 100%; max-width: 520px; }
    .svg-card {
      width: 100%; height: auto; display: block;
      border: 1px solid var(--line-2);
      background: radial-gradient(120% 120% at 50% 0%, var(--bg-2) 0%, var(--bg) 100%);
      box-shadow: 0 40px 80px -60px rgba(188, 156, 98, 0.4);
    }
    .play-btn {
      display: block; width: 100%;
      margin-top: 14px; padding: 14px 17px;
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: .16em; text-transform: uppercase;
      color: var(--dim); background: none;
      border: 1px solid var(--line-2);
      text-align: center; text-decoration: none;
      cursor: pointer; user-select: none; -webkit-user-select: none;
      transition: background .2s ease, color .2s ease, border-color .2s ease;
    }
    .play-btn:hover {
      background: var(--ink); color: var(--bg); border-color: var(--ink);
    }

    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95%           { transform: scaleY(.08); }
    }
    @keyframes scoreGlow {
      0%, 100% { opacity: .04; }
      50%      { opacity: var(--scoreglow-peak); }
    }
    @keyframes sheen {
      0%       { transform: translateX(-160px); opacity: 0; }
      12%      { opacity: var(--sheen-peak); }
      50%      { opacity: var(--sheen-peak); }
      88%      { opacity: 0; }
      100%     { transform: translateX(560px); opacity: 0; }
    }
    @keyframes foodBreathe {
      0%, 100% { transform: scale(.25); }
      50%      { transform: scale(1.08); }
    }
    @keyframes foodGlowBreathe {
      0%, 100% { opacity: .01; transform: scale(.25); }
      50%      { opacity: .12; transform: scale(1.16); }
    }
    @keyframes headChomp {
      0%, 100% { transform: translateX(0) scale(1); }
      20%      { transform: translateX(1px) scale(.98); }
      40%      { transform: translateX(0.5px) scale(.99); }
    }

    .food        { animation: foodBreathe 2.0s ease-in-out infinite; transform-origin: 440px 130px; }
    .food-glow   { animation: foodGlowBreathe 2.0s ease-in-out infinite; transform-origin: 440px 130px; }
    .eyes        { animation: blink 6.5s ease-in-out infinite; transform-origin: 427px 130px; }
    .head        { animation: headChomp 2.0s ease-in-out infinite; transform-origin: 427px 130px; }
    .score-glow  { animation: scoreGlow 6s ease-in-out infinite; }
    .sheen       { animation: sheen 11s ease-in-out infinite; }

    /* -- the snake comes alive -------------------------------------------------
       .sgn       a serpentine slither wave, phase-offset per segment so the wave
                  travels head-to-tail like a real undulation.
       .sgn rect  a copper charge pulse that surges through the body every 5.5s,
                  staggered tail->head: each segment flashes cream, bulges and
                  settles back as the wave rolls through it.
       .vein      a comet spark racing along the spine on the same 5.5s clock,
                  landing on the head exactly when the charge reaches it, where
                  .head-flare blooms.                                          */
    .sgn      { animation: slither 2.2s ease-in-out infinite;
                animation-delay: calc(var(--i) * -0.06s); }
    .sgn rect {
      transform-box: fill-box; transform-origin: center;
      animation: charge 5.5s linear infinite;
      animation-delay: calc(var(--i) * 0.06s);
    }
    @keyframes slither {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-1.7px); }
    }
    @keyframes charge {
      0%   { fill: #EDEBE6; transform: scale(1); }
      4%   { fill: #F7E8C8; transform: scale(1.22); }
      10%  { fill: #BC9C62; transform: scale(1.08); }
      20%  { fill: #EDEBE6; transform: scale(1); }
      100% { fill: #EDEBE6; transform: scale(1); }
    }
    .vein, .vein-glow {
      fill: none; stroke-linecap: round; stroke-linejoin: round;
      animation: veinRun 5.5s linear infinite;
    }
    .vein      { stroke: #F7E8C8; stroke-width: 1.8; stroke-dasharray: 16 1000; }
    .vein-glow { stroke: #BC9C62; stroke-width: 7; stroke-opacity: .2; stroke-dasharray: 34 1000; }
    @keyframes veinRun {
      0%   { stroke-dashoffset: 0; opacity: 0; }
      4%   { stroke-dashoffset: -48; opacity: 1; }
      38%  { stroke-dashoffset: -445; opacity: 1; }
      44%  { stroke-dashoffset: -529; opacity: 0; }
      100% { stroke-dashoffset: -529; opacity: 0; }
    }
    .head-flare {
      transform-box: fill-box; transform-origin: center;
      animation: headFlare 5.5s ease-out infinite;
      animation-delay: 0.15s;
    }
    @keyframes headFlare {
      0%, 36% { opacity: 0; transform: scale(.45); }
      41%     { opacity: .85; transform: scale(1.4); }
      50%     { opacity: .3;  transform: scale(1.05); }
      64%     { opacity: 0; transform: scale(.8); }
      100%    { opacity: 0; transform: scale(.45); }
    }
    .food-ping {
      fill: none; stroke: #BC9C62; stroke-width: 1.4;
      transform-box: fill-box; transform-origin: center;
      animation: foodPing 2.0s ease-out infinite;
    }
    @keyframes foodPing {
      0%, 50% { opacity: 0; transform: scale(.35); }
      62%     { opacity: .7; transform: scale(.9); }
      86%     { opacity: 0; transform: scale(1.7); }
      100%    { opacity: 0; transform: scale(1.7); }
    }
    .food-orbit { transform-origin: 440px 130px; animation: orbit 4.2s linear infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .food, .food-glow, .eyes, .head, .score-glow, .sheen,
      .sgn, .sgn rect, .head-flare, .food-orbit { animation: none; }
      .vein, .vein-glow, .food-ping { animation: none; opacity: 0; }
    }
  </style>

  <script src="../share-utils.js"></script>
  <script>
    (function () {
      function getParam(name) {
        var url = new URL(window.location.href);
        return url.searchParams.get(name);
      }

      var username = getParam('username') || 'Anonymous';
      var highscore = getParam('highscore') || '0';
      var fieldW = getParam('w') || '';
      var fieldH = getParam('h') || '';
      var token = getParam('t');
      if (token) {
        try {
          var data = deobfuscateShare(token);
          if (data && typeof data.n !== "undefined" && typeof data.s !== "undefined") {
            username = String(data.n).slice(0, 60);
            highscore = String(data.s);
            if (data.w) fieldW = String(data.w);
            if (data.h) fieldH = String(data.h);
          }
        } catch (e) {}
      }
      var titleText = document.getElementById('titleText');
      if (titleText && fieldW && fieldH) {
        titleText.textContent = fieldW + '×' + fieldH + ' Snake High Score';
      }
      var userText = document.getElementById('userText');
      var scoreText = document.getElementById('scoreText');
      if (scoreText) {
        var digits = String(highscore).replace(/[^0-9]/g, '') || '0';
        scoreText.textContent = digits.slice(0, 6).padStart(3, '0');
      }
      if (userText) {
        var boxWidth = 470;
        var baseSize = 22, minSize = 11;
        var fitName = function () {
          var name = username;
          var fontSize = baseSize;
          userText.textContent = name;
          userText.setAttribute('font-size', String(fontSize));
          var guard = 0;
          while (userText.getComputedTextLength() > boxWidth && fontSize > minSize && guard++ < 100) {
            fontSize -= 0.5;
            userText.setAttribute('font-size', String(fontSize));
          }
          if (userText.getComputedTextLength() > boxWidth) {
            // Minimum size reached and the name still overflows.  The display
            // font is proportional, so a fixed per-character width guess is
            // wrong -- wide uppercase glyphs overrun it.  Measure the real
            // rendered width of each candidate until it actually fits.
            var n = name.length, k = 0;
            while (n > 1 && k++ < 200) {
              n -= 1;
              var candidate = name.slice(0, n) + '…';
              userText.textContent = candidate;
              if (userText.getComputedTextLength() <= boxWidth) break;
            }
            userText.textContent = name.slice(0, n) + '…';
          }
        };
        fitName();
        // Re-fit once the webfont really is loaded: measuring before that
        // uses the fallback font, so getComputedTextLength() can lie.
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(fitName);
        }
      }
    })();
  </script>
