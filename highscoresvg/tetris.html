<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tetris High Score — Silas Kraume</title>
  <meta name="description" content="Tetris high score">
  <meta name="theme-color" content="#141413">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23141413'/%3E%3Crect x='10' y='10' width='44' height='44' fill='none' stroke='%23BC9C62' stroke-width='5'/%3E%3Ccircle cx='43' cy='43' r='7' fill='%23BC9C62'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141413;
      --bg-2: #1B1B19;
      --ink: #EDEBE6;
      --dim: #908E86;
      --faint: #5F5D57;
      --accent: #BC9C62;
      --line: rgba(237,235,230,0.08);
      --line-2: rgba(237,235,230,0.22);
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", "Courier New", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }
    .card { width: 100%; max-width: 520px; }
    .svg-card {
      width: 100%; height: auto; display: block;
      border: 1px solid var(--line-2);
      background: radial-gradient(120% 120% at 50% 0%, var(--bg-2) 0%, var(--bg) 100%);
      box-shadow: 0 40px 80px -60px rgba(188, 156, 98, 0.4);
    }
    .play-btn {
      display: block; width: 100%;
      margin-top: 14px; padding: 14px 17px;
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: .16em; text-transform: uppercase;
      color: var(--dim); background: none;
      border: 1px solid var(--line-2);
      text-align: center; text-decoration: none;
      cursor: pointer; user-select: none; -webkit-user-select: none;
      transition: background .2s ease, color .2s ease, border-color .2s ease;
    }
    .play-btn:hover {
      background: var(--ink); color: var(--bg); border-color: var(--ink);
    }
    @keyframes scoreGlow {
      0%, 100% { opacity: .04; }
      50%      { opacity: .11; }
    }
    @keyframes sheen {
      0%       { transform: translateX(-160px); opacity: 0; }
      12%      { opacity: .05; }
      50%      { opacity: .05; }
      88%      { opacity: 0; }
      100%     { transform: translateX(560px); opacity: 0; }
    }
    @keyframes fallT {
      0%   { transform: translateY(-230px); opacity: 0; }
      3%   { transform: translateY(-230px); opacity: 1; }
      62%  { transform: translateY(0); opacity: 1; }
      90%  { transform: translateY(0); opacity: 1; }
      92%  { transform: translateY(0); opacity: 0; }
      93%  { transform: translateY(-230px); opacity: 0; }
      100% { transform: translateY(-230px); opacity: 0; }
    }
    .score-glow { animation: scoreGlow 6s ease-in-out infinite; }
    .sheen      { animation: sheen 11s ease-in-out infinite; }
    .fall-t     { animation: fallT 2.6s cubic-bezier(.45,.05,.55,.95) infinite; }
    @media (prefers-reduced-motion: reduce) {
      .score-glow, .sheen, .fall-t { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <svg class="svg-card" viewBox="0 0 520 260" role="img" aria-label="Tetris high score">
      <defs>
        <radialGradient id="g" cx="50%" cy="0%" r="120%">
          <stop offset="0%" stop-color="#1F1F1B" stop-opacity="1" />
          <stop offset="100%" stop-color="#141413" stop-opacity="1" />
        </radialGradient>
        <radialGradient id="accentGlow">
          <stop offset="0%" stop-color="#BC9C62" stop-opacity="1" />
          <stop offset="100%" stop-color="#BC9C62" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#EDEBE6" stop-opacity="0" />
          <stop offset="50%" stop-color="#EDEBE6" stop-opacity="1" />
          <stop offset="100%" stop-color="#EDEBE6" stop-opacity="0" />
        </linearGradient>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#EDEBE6" stroke-width="0.5" opacity="0.03" />
        </pattern>
        <clipPath id="frame"><rect x="1" y="1" width="518" height="258" /></clipPath>
      </defs>
      <rect width="520" height="260" fill="url(#g)" />
      <rect width="520" height="260" fill="url(#grid)" opacity="0.08" />
      <ellipse class="score-glow" cx="86" cy="178" rx="120" ry="62" fill="url(#accentGlow)" />
      <g clip-path="url(#frame)"><rect class="sheen" x="0" y="0" width="90" height="260" fill="url(#sheenGrad)" /></g>
      <rect x="1" y="1" width="518" height="258" fill="none" stroke="rgba(237,235,230,0.12)" />

      <g transform="translate(330, 176)">
        <!-- Row 0: --S------- -->
        <rect x="32" y="-16" width="16" height="16" rx="3.2" opacity="0.7" fill="#72B55C" />
        <!-- Row 1: --SS-L---- -->
        <rect x="32" y="0" width="16" height="16" rx="3.2" opacity="0.7" fill="#72B55C" />
        <rect x="48" y="0" width="16" height="16" rx="3.2" opacity="0.7" fill="#72B55C" />
        <rect x="80" y="0" width="16" height="16" rx="3.2" opacity="0.7" fill="#E18A45" />
        <!-- Row 2: OOJS-LZZ-- -->
        <rect x="0"  y="16" width="16" height="16" rx="3.2" opacity="0.7" fill="#D7B23F" />
        <rect x="16" y="16" width="16" height="16" rx="3.2" opacity="0.7" fill="#D7B23F" />
        <rect x="32" y="16" width="16" height="16" rx="3.2" opacity="0.7" fill="#6174CF" />
        <rect x="48" y="16" width="16" height="16" rx="3.2" opacity="0.7" fill="#72B55C" />
        <rect x="80" y="16" width="16" height="16" rx="3.2" opacity="0.7" fill="#E18A45" />
        <rect x="96" y="16" width="16" height="16" rx="3.2" opacity="0.7" fill="#D65A62" />
        <rect x="112" y="16" width="16" height="16" rx="3.2" opacity="0.7" fill="#D65A62" />
        <!-- Row 3: OOJJJLLZZ- -->
        <rect x="0"  y="32" width="16" height="16" rx="3.2" opacity="0.7" fill="#D7B23F" />
        <rect x="16" y="32" width="16" height="16" rx="3.2" opacity="0.7" fill="#D7B23F" />
        <rect x="32" y="32" width="16" height="16" rx="3.2" opacity="0.7" fill="#6174CF" />
        <rect x="48" y="32" width="16" height="16" rx="3.2" opacity="0.7" fill="#6174CF" />
        <rect x="64" y="32" width="16" height="16" rx="3.2" opacity="0.7" fill="#6174CF" />
        <rect x="80" y="32" width="16" height="16" rx="3.2" opacity="0.7" fill="#E18A45" />
        <rect x="96" y="32" width="16" height="16" rx="3.2" opacity="0.7" fill="#E18A45" />
        <rect x="112" y="32" width="16" height="16" rx="3.2" opacity="0.7" fill="#D65A62" />
        <rect x="128" y="32" width="16" height="16" rx="3.2" opacity="0.7" fill="#D65A62" />
      </g>

      <g class="fall-t">
        <g transform="translate(458, 176)">
          <rect x="16" y="0"  width="16" height="16" rx="3.2" fill="#B36AC2" />
          <rect x="0"  y="16" width="16" height="16" rx="3.2" fill="#B36AC2" />
          <rect x="16" y="16" width="16" height="16" rx="3.2" fill="#B36AC2" />
          <rect x="16" y="32" width="16" height="16" rx="3.2" fill="#B36AC2" />
        </g>
      </g>

      <text x="32" y="48" font-family="var(--font-mono)" font-size="10" letter-spacing="0.18em" text-transform="uppercase" fill="#908E86">Laboratory · Lab 09</text>
      <text x="32" y="78" font-family="var(--font-display)" font-size="24" font-weight="400" fill="#EDEBE6">Tetris High Score</text>
      <text x="32" y="106" font-family="var(--font-mono)" font-size="11" letter-spacing="0.16em" text-transform="uppercase" fill="#908E86">Lines</text>
      <text id="linesText" x="32" y="124" font-family="var(--font-display)" font-weight="300" fill="#BC9C62" text-anchor="start" dominant-baseline="middle">—</text>
      <text x="32" y="152" font-family="var(--font-mono)" font-size="11" letter-spacing="0.16em" text-transform="uppercase" fill="#908E86">Score</text>
      <text id="scoreText" x="32" y="194" font-family="var(--font-mono)" font-size="52" font-weight="500" letter-spacing="0.08em" fill="#EDEBE6">0</text>
      <text x="130" y="106" font-family="var(--font-mono)" font-size="11" letter-spacing="0.16em" text-transform="uppercase" fill="#908E86">Player</text>
      <text id="userText" x="130" y="124" font-family="var(--font-display)" font-weight="300" fill="#BC9C62" text-anchor="start" dominant-baseline="middle">Anonymous</text>
      <text x="32" y="222" font-family="var(--font-mono)" font-size="10" letter-spacing="0.18em" text-transform="uppercase" fill="#5F5D57">silenzcience.github.io · tetris</text>
    </svg>
    <a class="play-btn" href="../lab/tetris.html">Try to beat it →</a>
  </main>
  <script src="../share-utils.js"></script>
  <script>
    (function () {
      function getParam(name) {
        var url = new URL(window.location.href);
        return url.searchParams.get(name);
      }
      var username = getParam('username') || 'Anonymous';
      var highscore = getParam('highscore') || '0';
      var lines = getParam('lines') || '';
      var token = getParam('t');
      if (token) {
        try {
          var data = deobfuscateShare(token);
          if (data && typeof data.n !== 'undefined' && typeof data.s !== 'undefined') {
            username = String(data.n).slice(0, 60);
            highscore = String(data.s);
            if (typeof data.l !== 'undefined') lines = String(data.l);
          }
        } catch (e) {}
      }
      var userText = document.getElementById('userText');
      var scoreText = document.getElementById('scoreText');
      var linesText = document.getElementById('linesText');
      if (scoreText) {
        scoreText.textContent = Number(highscore).toLocaleString();
        // Keep the score string clear of the Player column if it gets wide.
        var fs = 52, minFs = 30, boxW = 224;
        scoreText.setAttribute('font-size', String(fs));
        while (scoreText.getComputedTextLength() > boxW && fs > minFs) {
          fs -= 0.5; scoreText.setAttribute('font-size', String(fs));
        }
      }
      if (linesText) {
        var lNum = String(lines).replace(/[^0-9]/g, '');
        linesText.textContent = lNum ? String(parseInt(lNum, 10)) : '—';
        var lSize = 22, lBox = 96;
        linesText.setAttribute('font-size', String(lSize));
        var lGuard = 0;
        while (linesText.getComputedTextLength() > lBox && lSize > 12 && lGuard++ < 50) {
          lSize -= 0.5; linesText.setAttribute('font-size', String(lSize));
        }
      }
      if (userText) {
        var boxWidth = 380;
        var baseSize = 22, minSize = 11;
        var fitName = function () {
          var name = username;
          var fontSize = baseSize;
          userText.textContent = name;
          userText.setAttribute('font-size', String(fontSize));
          var guard = 0;
          while (userText.getComputedTextLength() > boxWidth && fontSize > minSize && guard++ < 100) {
            fontSize -= 0.5;
            userText.setAttribute('font-size', String(fontSize));
          }
          if (userText.getComputedTextLength() > boxWidth) {
            // Minimum size reached and the name still overflows.  The display
            // font is proportional, so a fixed per-character width guess is
            // wrong -- wide uppercase glyphs overrun it.  Measure the real
            // rendered width of each candidate until it actually fits.
            var n = name.length, k = 0;
            while (n > 1 && k++ < 200) {
              n -= 1;
              var candidate = name.slice(0, n) + '…';
              userText.textContent = candidate;
              if (userText.getComputedTextLength() <= boxWidth) break;
            }
            userText.textContent = name.slice(0, n) + '…';
          }
        };
        fitName();
        // Re-fit once the webfont really is loaded: measuring before that
        // uses the fallback font, so getComputedTextLength() can lie.
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(fitName);
        }
      }
    })();
  </script>
</body>
</html>
