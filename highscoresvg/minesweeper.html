<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minesweeper High Score — Silas Kraume</title>
  <meta name="description" content="Minesweeper high score">
  <meta name="theme-color" content="#141413">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23141413'/%3E%3Crect x='10' y='10' width='44' height='44' fill='none' stroke='%23BC9C62' stroke-width='5'/%3E%3Ccircle cx='43' cy='43' r='7' fill='%23BC9C62'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141413;
      --bg-2: #1B1B19;
      --ink: #EDEBE6;
      --dim: #908E86;
      --faint: #5F5D57;
      --accent: #BC9C62;
      --line: rgba(237,235,230,0.08);
      --line-2: rgba(237,235,230,0.22);
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", "Courier New", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }
    .card { width: 100%; max-width: 520px; }
    .svg-card {
      width: 100%; height: auto; display: block;
      border: 1px solid var(--line-2);
      background: radial-gradient(120% 120% at 50% 0%, var(--bg-2) 0%, var(--bg) 100%);
      box-shadow: 0 40px 80px -60px rgba(188, 156, 98, 0.4);
    }
    .play-btn {
      display: block; width: 100%;
      margin-top: 14px; padding: 14px 17px;
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: .16em; text-transform: uppercase;
      color: var(--dim); background: none;
      border: 1px solid var(--line-2);
      text-align: center; text-decoration: none;
      cursor: pointer; user-select: none; -webkit-user-select: none;
      transition: background .2s ease, color .2s ease, border-color .2s ease;
    }
    .play-btn:hover {
      background: var(--ink); color: var(--bg); border-color: var(--ink);
    }
    @keyframes scoreGlow {
      0%, 100% { opacity: .04; }
      50%      { opacity: .11; }
    }
    @keyframes sheen {
      0%       { transform: translateX(-160px); opacity: 0; }
      12%      { opacity: .05; }
      50%      { opacity: .05; }
      88%      { opacity: 0; }
      100%     { transform: translateX(560px); opacity: 0; }
    }
    @keyframes mineCycle {
      0%    { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
      10%   { transform: translateY(1.8px) scale(1) rotate(0); opacity: 1; }
      20%   { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
      30%   { transform: translateY(-1.8px) scale(1) rotate(0); opacity: 1; }
      40%   { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
      42%   { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
      45%   { transform: translateY(0.5px) scale(1.02, 0.98) rotate(2deg); opacity: 1; }
      48%   { transform: translateY(-0.5px) scale(1.02, 0.98) rotate(-4deg); opacity: 1; }
      51%   { transform: translateY(0.5px) scale(1.03, 0.97) rotate(5deg); opacity: 1; }
      54%   { transform: translateY(-0.3px) scale(1.02, 0.98) rotate(-3deg); opacity: 1; }
      56%   { transform: translateY(0) scale(1.12, 0.9) rotate(0); opacity: 1; }
      58%   { transform: translateY(0) scale(1.6) rotate(3deg); opacity: 1; }
      61%   { transform: translateY(-4px) scale(3) rotate(-5deg); opacity: 1; }
      64%   { transform: translateY(-6px) scale(5.2) rotate(6deg); opacity: 0.9; }
      67%   { transform: translateY(-8px) scale(7.2) rotate(-4deg); opacity: 0.65; }
      71%   { transform: translateY(-9px) scale(8.4) rotate(4deg); opacity: 0.3; }
      75%   { transform: translateY(-9px) scale(8.8) rotate(0); opacity: 0; }
      87%   { transform: translateY(0) scale(0.35) rotate(0); opacity: 0; }
      91%   { transform: translateY(0) scale(1.15) rotate(-2deg); opacity: 1; }
      95%   { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
      100%  { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
    }
    @keyframes boomStar {
      0%, 56% { opacity: 0; transform: scale(0.15); }
      59%     { opacity: 0.95; transform: scale(0.75); }
      64%     { opacity: 0.9; transform: scale(1.6); }
      70%     { opacity: 0.35; transform: scale(2.2); }
      77%     { opacity: 0; transform: scale(2.6); }
      100%    { opacity: 0; transform: scale(2.6); }
    }
    @keyframes boomFlash {
      0%, 54% { opacity: 0; transform: scale(0.2); }
      57%     { opacity: 1; transform: scale(0.7); }
      60%     { opacity: 0.85; transform: scale(1.5); }
      64%     { opacity: 0; transform: scale(2.4); }
      100%    { opacity: 0; transform: scale(2.4); }
    }
    @keyframes boomGlow {
      0%, 56% { opacity: 0; transform: scale(0.3); }
      60%     { opacity: 0.45; transform: scale(1.5); }
      66%     { opacity: 0.2; transform: scale(2.8); }
      74%     { opacity: 0; transform: scale(4); }
      100%    { opacity: 0; transform: scale(4); }
    }
    @keyframes boomRing {
      0%, 56% { opacity: 0; transform: scale(0.3); }
      58%     { opacity: 0.95; transform: scale(0.7); }
      68%     { opacity: 0.55; transform: scale(4); }
      80%     { opacity: 0.12; transform: scale(10); }
      90%     { opacity: 0; transform: scale(14); }
      100%    { opacity: 0; transform: scale(14); }
    }
    @keyframes boomRing2 {
      0%, 58% { opacity: 0; transform: scale(0.3); }
      61%     { opacity: 0.85; transform: scale(0.9); }
      73%     { opacity: 0.35; transform: scale(6); }
      86%     { opacity: 0; transform: scale(13); }
      100%    { opacity: 0; transform: scale(13); }
    }
    @keyframes sparkFly {
      0%, 54%  { opacity: 0; transform: translate(0, 0) scale(0.6); }
      57%      { opacity: 1; transform: translate(0, 0) scale(1); }
      68%      { opacity: 1; transform: translate(calc(var(--dx) * 0.45), calc(var(--dy) * 0.45)) scale(1.15); }
      82%      { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
      100%     { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
    }
    @keyframes cardShake {
      0%, 54%, 76%, 100% { transform: translate(0, 0); }
      58%  { transform: translate(2px, -1.5px); }
      61%  { transform: translate(-2px, 1px); }
      64%  { transform: translate(1.5px, 2px); }
      67%  { transform: translate(-1px, -2px); }
      70%  { transform: translate(0.5px, 1px); }
      73%  { transform: translate(-0.5px, 0.5px); }
    }
    @keyframes sweepNum {
      0%, 100% { opacity: 0.45; }
      22%      { opacity: 1; }
      44%      { opacity: 0.45; }
    }
    @keyframes boardIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .score-glow { animation: scoreGlow 6s ease-in-out infinite; }
    .sheen      { animation: sheen 11s ease-in-out infinite; }
    .mine   { animation: mineCycle 6.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .boom, .boom-flash, .boom-glow, .boom-ring, .boom-ring2, .spark { transform-box: fill-box; transform-origin: center; }
    .boom       { animation: boomStar 6.4s ease-out infinite; }
    .boom-flash { animation: boomFlash 6.4s ease-out infinite; }
    .boom-glow  { animation: boomGlow 6.4s ease-out infinite; }
    .boom-ring  { animation: boomRing 6.4s ease-out infinite; }
    .boom-ring2 { animation: boomRing2 6.4s ease-out infinite; }
    .spark      { animation: sparkFly 6.4s linear infinite; }
    .shake      { animation: cardShake 6.4s ease-out infinite; }
    .sweep-n    { animation: sweepNum 2.4s ease-in-out infinite; }
    .sweep-n-1  { animation-delay: 0s; }
    .sweep-n-2  { animation-delay: .4s; }
    .sweep-n-3  { animation-delay: .8s; }
    .board-fade { animation: boardIn 2.4s ease-out forwards; }
    @media (prefers-reduced-motion: reduce) {
      .score-glow, .sheen, .mine, .shake, .sweep-n, .board-fade { animation: none; }
      .boom, .boom-flash, .boom-glow, .boom-ring, .boom-ring2, .spark { animation: none; opacity: 0; }
    }
  </style>

  <script src="../share-utils.js"></script>
  <script>
    (function () {
      function getParam(name) {
        var url = new URL(window.location.href);
        return url.searchParams.get(name);
      }
      var username = getParam('username') || 'Anonymous';
      var time = Math.max(0, parseInt(getParam('time'), 10) || 0);
      var fieldW = getParam('w') || '';
      var fieldH = getParam('h') || '';
      var token = getParam('t');
      if (token) {
        try {
          var data = deobfuscateShare(token);
          if (data && typeof data.n !== 'undefined' && typeof data.s !== 'undefined') {
            username = String(data.n).slice(0, 60);
            time = Math.max(0, Math.floor(Number(data.s) || 0));
            if (data.w) fieldW = String(data.w);
            if (data.h) fieldH = String(data.h);
          }
        } catch (e) {}
      }
      var titleText = document.getElementById('titleText');
      if (titleText && fieldW && fieldH) {
        titleText.textContent = fieldW + '×' + fieldH + ' Minesweeper High Score';
      }
      var scoreText = document.getElementById('scoreText');
      if (scoreText) {
        var hh = Math.floor(time / 3600);
        var mm = Math.floor((time % 3600) / 60);
        var ss = time % 60;
        scoreText.textContent = hh + ':' + (mm < 10 ? '0' + mm : mm) + ':' + (ss < 10 ? '0' + ss : ss);
        // Keep the H:MM:SS string clear of the Player column if it gets wide.
        var fs = 52; var minFs = 30; var boxW = 224;
        scoreText.setAttribute('font-size', String(fs));
        while (scoreText.getComputedTextLength() > boxW && fs > minFs) {
          fs -= 0.5; scoreText.setAttribute('font-size', String(fs));
        }
      }
      var userText = document.getElementById('userText');
      if (userText) {
        userText.textContent = username;
        var baseSize = 22; var minSize = 11; var fontSize = baseSize;
        var boxWidth = 230; var g = 0;
        userText.setAttribute('font-size', String(fontSize));
        while (userText.getComputedTextLength() > boxWidth && fontSize > minSize && g++ < 100) {
          fontSize -= 0.5; userText.setAttribute('font-size', String(fontSize));
        }
      }
    })();
  </script>
