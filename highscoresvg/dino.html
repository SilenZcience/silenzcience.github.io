<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>T-Rex Runner High Score</title>
  <meta name="description" content="Check out my T-Rex Runner high score">
  <meta name="theme-color" content="#141413">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23141413'/%3E%3Crect x='10' y='10' width='44' height='44' fill='none' stroke='%23BC9C62' stroke-width='5'/%3E%3Ccircle cx='43' cy='43' r='7' fill='%23BC9C62'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141413;
      --bg-2: #1B1B19;
      --ink: #EDEBE6;
      --dim: #908E86;
      --faint: #5F5D57;
      --accent: #BC9C62;
      --line: rgba(237,235,230,0.08);
      --line-2: rgba(237,235,230,0.22);
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", "Courier New", monospace;
      --sheen-peak: 0.05;
      --scoreglow-peak: 0.11;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .card { width: 100%; max-width: 520px; }
    .svg-card {
      width: 100%; height: auto; display: block;
      border: 1px solid var(--line-2);
      background: radial-gradient(120% 120% at 50% 0%, var(--bg-2) 0%, var(--bg) 100%);
      box-shadow: 0 40px 80px -60px rgba(188, 156, 98, 0.4);
    }
    .play-btn {
      display: block; width: 100%;
      margin-top: 14px; padding: 14px 17px;
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: .16em; text-transform: uppercase;
      color: var(--dim); background: none;
      border: 1px solid var(--line-2);
      text-align: center; text-decoration: none;
      cursor: pointer; user-select: none; -webkit-user-select: none;
      transition: background .2s ease, color .2s ease, border-color .2s ease;
    }
    .play-btn:hover {
      background: var(--ink); color: var(--bg); border-color: var(--ink);
    }

    @keyframes blink {
      0%, 91%, 100% { opacity: 0; }
      93%, 96%      { opacity: 1; }
    }
    @keyframes scoreGlow {
      0%, 100% { opacity: .04; }
      50%      { opacity: var(--scoreglow-peak); }
    }
    @keyframes sheen {
      0%       { transform: translateX(-160px); opacity: 0; }
      12%      { opacity: var(--sheen-peak); }
      50%      { opacity: var(--sheen-peak); }
      88%      { opacity: 0; }
      100%     { transform: translateX(560px); opacity: 0; }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-2px); }
    }
    /* Chrome-run crossfades: two baked sprite frames alternate like the arcade. */
    @keyframes stepA {
      0%, 49.9%  { opacity: 1; }
      50%, 100%  { opacity: 0; }
    }
    @keyframes stepB {
      0%, 49.9%  { opacity: 0; }
      50%, 100%  { opacity: 1; }
    }
    @keyframes drift {
      0%       { transform: translateX(0); opacity: 0; }
      8%       { opacity: .55; }
      78%      { opacity: .55; }
      90%      { transform: translateX(-360px); opacity: 0; }
      100%     { transform: translateX(-360px); opacity: 0; }
    }
    @keyframes dustKick {
      0%, 6%    { opacity: 0; transform: translate(0, 0) scale(1); }
      9%        { opacity: .5; }
      19%       { opacity: 0; transform: translate(-26px, -8px) scale(.3); }
      21%       { opacity: 0; transform: translate(0, 0) scale(1); }
      24%       { opacity: .4; }
      32%       { opacity: 0; transform: translate(-22px, -6px) scale(.3); }
      34%, 100% { opacity: 0; transform: translate(0, 0) scale(1); }
    }
    @keyframes dustLand {
      0%, 72% { opacity: 0; transform: translate(0, 0) scale(.4); }
      76%     { opacity: .85; transform: translate(-2px, -3px) scale(1.15); }
      100%    { opacity: 0; transform: translate(var(--dx, -24px), var(--dy, -10px)) scale(.15); }
    }
    @keyframes cactusRun {
      0%    { transform: translateX(110px); opacity: 0; }
      4%    { opacity: .62; }
      78%   { transform: translateX(-170px); opacity: .62; }
      86%   { opacity: 0; }
      100%  { transform: translateX(-210px); opacity: 0; }
    }
    @keyframes groundScroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-60px); }
    }
    @keyframes dinoJump {
      0%, 34%   { transform: translateY(0) rotate(0deg) scale(1, 1); }
      37%       { transform: translateY(4px) rotate(0deg) scale(1.07, .88);
                  animation-timing-function: cubic-bezier(.3, 0, .9, .5); }
      39%       { transform: translateY(-52px) rotate(-3deg) scale(.97, 1.05);
                  animation-timing-function: cubic-bezier(.15, .6, .35, 1); }
      44%       { transform: translateY(-70px) rotate(-5deg) scale(1, 1.01); }
      68%       { transform: translateY(-70px) rotate(-4deg) scale(1, 1);
                  animation-timing-function: cubic-bezier(.55, .05, .8, .45); }
      72%       { transform: translateY(-30px) rotate(-1deg) scale(1, 1.02); }
      74%       { transform: translateY(-3px) rotate(0deg) scale(1, 1.01); }
      76%       { transform: translateY(4px) rotate(0deg) scale(1.12, .84); }
      80%       { transform: translateY(-1px) rotate(0deg) scale(.96, 1.05); }
      85%, 100% { transform: translateY(0) rotate(0deg) scale(1, 1); }
    }
    @keyframes dinoShadow {
      0%, 38%   { opacity: .55; transform: scaleX(1); }
      44%, 68%  { opacity: .12; transform: scaleX(.42); }
      73%       { opacity: .48; transform: scaleX(.88); }
      76%       { opacity: .78; transform: scaleX(1.2); }
      82%, 100% { opacity: .55; transform: scaleX(1); }
    }
    @keyframes speedLine {
      0%   { opacity: 0; transform: translateX(0) scaleX(.3); }
      14%  { opacity: .7; transform: translateX(-16px) scaleX(1); }
      62%  { opacity: .28; transform: translateX(-104px) scaleX(.85); }
      100% { opacity: 0; transform: translateX(-150px) scaleX(.4); }
    }
    @keyframes sunDrift {
      0%    { transform: translate(70px, 140px); opacity: 0; }
      9%    { transform: translate(48px, 58px); opacity: .85; }
      27%   { transform: translate(-16px, 26px); opacity: .95; }
      48%   { transform: translate(-70px, 40px); opacity: .85; }
      58%   { transform: translate(-104px, 108px); opacity: .25; }
      63%   { transform: translate(-118px, 140px); opacity: 0; }
      100%  { transform: translate(-118px, 140px); opacity: 0; }
    }
    @keyframes duskWash {
      0%, 48%    { opacity: 0; }
      58%        { opacity: .14; }
      68%, 100%  { opacity: 0; }
    }
    @keyframes nightWash {
      0%, 58%    { opacity: 0; }
      70%, 90%   { opacity: .55; }
      99%, 100%  { opacity: 0; }
    }
    @keyframes moonDrift {
      0%, 58% { transform: translate(70px, 150px); opacity: 0; }
      70%    { transform: translate(30px, 42px); opacity: .9; }
      84%    { transform: translate(-24px, 22px); opacity: 1; }
      94%    { transform: translate(-70px, 66px); opacity: .5; }
      100%   { transform: translate(-88px, 108px); opacity: 0; }
    }
    @keyframes nightGate {
      0%, 60%   { opacity: 0; }
      70%, 92%  { opacity: 1; }
      99%, 100% { opacity: 0; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: .12; }
      50%      { opacity: .9; }
    }
    @keyframes pteroFly {
      0%    { transform: translate(250px, -16px); opacity: 0; }
      9%    { transform: translate(212px, -6px); opacity: .8; }
      55%   { transform: translate(92px, 16px); opacity: .8; }
      86%   { transform: translate(18px, -4px); opacity: .8; }
      92%   { transform: translate(10px, -6px); opacity: 0; }
      100%  { transform: translate(10px, -6px); opacity: 0; }
    }

    .dino-jump   { transform-origin: 382px 215px;
                   animation: dinoJump 2.6s ease-in-out infinite; }
    .dino        { animation: bob .5s ease-in-out infinite; transform-origin: 382px 215px; }
    .dino-shadow { transform-box: fill-box; transform-origin: center;
                   animation: dinoShadow 2.6s ease-in-out infinite; }
    .run-a       { animation: stepA .42s linear infinite; }
    .run-b       { animation: stepB .42s linear infinite; }
    .eyes        { opacity: 0; animation: blink 6.5s ease-in-out infinite; }
    .cloud       { animation: drift 9s linear infinite; }
    .ptero       { animation: pteroFly 12s linear infinite; }
    .flap-a      { animation: stepA .8s linear infinite; }
    .flap-b      { animation: stepB .8s linear infinite; }
    .sun         { animation: sunDrift 24s ease-in-out infinite; }
    .moon        { animation: moonDrift 24s ease-in-out infinite; }
    .night-sky   { animation: nightGate 24s ease-in-out infinite; }
    .star        { animation: twinkle 3.2s ease-in-out infinite; }
    .sky-dusk    { animation: duskWash 24s ease-in-out infinite; }
    .sky-night   { animation: nightWash 24s ease-in-out infinite; }
    .ground-scroll { animation: groundScroll .435s linear infinite; }
    .cactus-run  { animation: cactusRun 2.6s linear infinite; }
    .speed-line  { transform-box: fill-box; transform-origin: 100% 50%;
                   animation: speedLine .8s linear infinite; }
    .dust-kick   { transform-box: fill-box; transform-origin: center;
                   animation: dustKick 2.6s linear infinite; }
    .dust-land   { transform-box: fill-box; transform-origin: center;
                   animation: dustLand 2.6s ease-out infinite; }
    .score-glow  { animation: scoreGlow 6s ease-in-out infinite; }
    .sheen       { animation: sheen 11s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .dino, .dino-jump, .dino-shadow, .run-a, .run-b, .flap-a, .flap-b, .eyes,
      .cloud, .score-glow, .sheen, .ground-scroll, .cactus-run, .speed-line,
      .sun, .moon, .night-sky, .star, .sky-dusk, .sky-night, .ptero,
      .dust-kick, .dust-land { animation: none; }
      .dust-kick, .dust-land, .speed-line, .sky-dusk, .sky-night, .night-sky { opacity: 0; }
      .flap-b { opacity: 0; }
      .run-b { opacity: 0; }
    }
  </style>
</head>
<body>
  <main class="card">
    <svg id="scoreSvg" class="svg-card" viewBox="0 0 520 260" role="img" aria-label="Dino high score">
      <defs>
        <radialGradient id="g" cx="50%" cy="0%" r="120%">
          <stop offset="0%" stop-color="#1F1F1B" stop-opacity="1" />
          <stop offset="100%" stop-color="#141413" stop-opacity="1" />
        </radialGradient>
        <radialGradient id="accentGlow">
          <stop offset="0%" stop-color="#BC9C62" stop-opacity="1" />
          <stop offset="100%" stop-color="#BC9C62" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#EDEBE6" stop-opacity="0" />
          <stop offset="50%" stop-color="#EDEBE6" stop-opacity="1" />
          <stop offset="100%" stop-color="#EDEBE6" stop-opacity="0" />
        </linearGradient>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#EDEBE6" stroke-width="0.5" opacity="0.03" />
        </pattern>
        <linearGradient id="duskFade" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#BC9C62" stop-opacity="0" />
          <stop offset="45%" stop-color="#BC9C62" stop-opacity="0.4" />
          <stop offset="100%" stop-color="#BC9C62" stop-opacity="1" />
        </linearGradient>
        <linearGradient id="nightFade" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#0A1020" stop-opacity="0" />
          <stop offset="38%" stop-color="#0A1020" stop-opacity="0.35" />
          <stop offset="60%" stop-color="#0A1020" stop-opacity="1" />
          <stop offset="100%" stop-color="#0A1020" stop-opacity="1" />
        </linearGradient>
        <g id="groundTile">
          <rect x="0" y="220" width="16" height="2" opacity=".22" />
          <rect x="24" y="218" width="9" height="2" opacity=".16" />
          <rect x="42" y="221" width="12" height="2" opacity=".26" />
        </g>
        <clipPath id="frame"><rect x="1" y="1" width="518" height="258" /></clipPath>
        <clipPath id="groundClip"><rect x="300" y="210" width="220" height="18" /></clipPath>
      </defs>

      <rect width="520" height="260" fill="url(#g)" />
      <rect width="520" height="260" fill="url(#grid)" opacity="0.08" />

      <ellipse class="score-glow" cx="86" cy="178" rx="120" ry="62" fill="url(#accentGlow)" />

      <g clip-path="url(#frame)">
        <rect class="sheen" x="0" y="0" width="90" height="260" fill="url(#sheenGrad)" />
      </g>

      <rect x="1" y="1" width="518" height="258" fill="none" stroke="rgba(237,235,230,0.12)" />

      <!-- the scene: scrolling ground, sun/moon day-night cycle, clouds,
           flapjiro the flyer, a cactus rolling in, and the runner -->
      <g clip-path="url(#frame)">
        <rect x="300" y="214" width="212" height="2" fill="#EDEBE6" opacity=".45" />
        <g class="ground-scroll">
          <use href="#groundTile" x="300" />
          <use href="#groundTile" x="360" />
          <use href="#groundTile" x="420" />
          <use href="#groundTile" x="480" />
          <use href="#groundTile" x="540" />
        </g>

        <g class="sun" opacity=".85">
          <circle cx="450" cy="50" r="34" fill="url(#accentGlow)" opacity=".28" />
          <circle cx="450" cy="50" r="13" fill="#EDEBE6" />
          <circle cx="450" cy="50" r="19" fill="none" stroke="#EDEBE6" stroke-width="1" opacity=".2" />
        </g>

        <g class="cloud" opacity=".55" style="animation-delay:-3s; animation-duration:13s">
          <g fill="#EDEBE6" opacity=".22">
            <circle cx="430" cy="44" r="8" />
            <circle cx="444" cy="40" r="11" />
            <circle cx="459" cy="44" r="9" />
          </g>
        </g>
        <g class="cloud" opacity=".55">
          <g fill="#EDEBE6" opacity=".28">
            <circle cx="330" cy="76" r="10" />
            <circle cx="346" cy="71" r="13" />
            <circle cx="364" cy="76" r="11" />
          </g>
        </g>

        <g class="ptero" opacity=".8">
          <g class="flap-a" fill="rgba(237,235,230,.35)">
            <path d="M306 82h8v4h-8zM302 86h4v4h-4zM314 86h4v8h-4zM298 90h4v4h-4zM294 94h4v4h-4zM318 94h4v4h-4zM290 98h4v4h-4zM318 98h28v4h-28zM286 102h4v4h-4zM346 102h4v4h-4zM286 106h28v4h-28zM350 106h28v4h-28zM314 110h4v4h-4zM374 110h4v4h-4zM362 114h12v4h-12zM370 118h4v4h-4zM358 122h12v4h-12zM338 126h20v4h-20zM334 130h4v4h-4zM330 134h4v8h-4zM318 114h4v32h-4zM326 142h4v4h-4zM322 146h4v4h-4z" />
            <path fill="#EDEBE6" d="M306 86h8v4h-8zM302 90h12v4h-12zM298 94h20v4h-20zM294 98h24v4h-24zM290 102h56v4h-56zM314 106h36v4h-36zM318 110h56v4h-56zM322 114h40v4h-40zM322 118h48v4h-48zM322 122h36v4h-36zM322 126h16v4h-16zM322 130h12v4h-12zM322 134h8v8h-8zM322 142h4v4h-4z" />

            <path fill="#EDEBE6" d="M318 74h4v4h-4zM318 78h8v4h-8zM318 82h12v4h-12zM306 86h8v4h-8zM322 86h12v4h-12zM302 90h12v4h-12zM322 90h16v4h-16zM298 94h20v4h-20zM322 94h20v4h-20zM294 98h24v4h-24zM322 98h24v4h-24zM290 102h56v4h-56zM314 106h36v4h-36zM318 110h56v4h-56zM322 114h40v4h-40zM326 118h44v4h-44zM330 122h28v4h-28z" />
          </g>
        </g>

        <g fill="#EDEBE6" opacity=".26">
          <rect class="speed-line" x="452" y="98"  width="58" height="1.5" style="animation-delay:-.2s" />
          <rect class="speed-line" x="470" y="132" width="40" height="1.5" style="animation-delay:-.75s" />
          <rect class="speed-line" x="446" y="166" width="64" height="1.5" style="animation-delay:-1.1s" />
          <rect class="speed-line" x="482" y="188" width="28" height="1.5" style="animation-delay:-.5s" />
        </g>

        <!-- cactus rolls in from the right; the runner jumps it -->

          <rect x="466" y="152" width="10" height="62" />
          <rect x="456" y="170" width="10" height="4" />

          <rect x="476" y="178" width="10" height="4" />
          <rect x="482" y="166" width="4" height="16" />
        </g>

        <ellipse class="dino-shadow" cx="384" cy="216" rx="26" ry="3.5" fill="#050504" opacity=".55" />

        <!-- the dino: two chrome-standard run frames, crossfaded, mid-jump -->

          <g class="dino">
            <g class="run-a" fill="rgba(237,235,230,.35)">

              <path fill="#EDEBE6" d="M386 125h32v4h-32zM382 129h40v2h-40zM382 131h8v4h-8zM394 131h28v4h-28zM382 135h40v12h-40zM382 147h20v4h-20zM382 151h32v4h-32zM378 155h20v4h-20zM342 155h4v8h-4zM372 159h26v4h-26zM342 163h8v4h-8zM366 163h40v4h-40zM342 167h12v4h-12zM362 167h36v4h-36zM402 167h4v4h-4zM342 171h56v8h-56zM346 179h52v2h-52zM346 181h48v2h-48zM350 183h44v4h-44zM354 187h36v4h-36zM358 191h28v4h-28zM362 195h12v4h-12zM382 195h10v4h-10zM362 199h8v4h-8zM362 203h4v4h-4zM362 207h8v4h-8z" />

  <script src="../share-utils.js"></script>
  <script>
    (function () {
      function getParam(name) {
        var url = new URL(window.location.href);
        return url.searchParams.get(name);
      }

      var username = getParam('username') || 'Anonymous';
      var highscore = getParam('highscore') || '0';
      var token = getParam('t');
      if (token) {
        try {
          var data = deobfuscateShare(token);
          if (data && typeof data.n !== "undefined" && typeof data.s !== "undefined") {
            username = String(data.n).slice(0, 60);
            highscore = String(data.s);
          }
        } catch (e) {}
      }
      var userText = document.getElementById('userText');
      var scoreText = document.getElementById('scoreText');
      if (scoreText) {
        var digits = String(highscore).replace(/[^0-9]/g, '') || '0';
        digits = digits.slice(0, 5).padStart(5, '0');
        var target = parseInt(digits, 10) || 0;
        var reduced = window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced || target === 0) {
          scoreText.textContent = digits;
        } else {
          // arcade-style roll-up: the counter races up, then eases into place
          var rollDur = 1600, rollStart = null;
          var rollUp = function (ts) {
            if (rollStart === null) rollStart = ts;
            var p = Math.min(1, (ts - rollStart) / rollDur);
            var eased = 1 - Math.pow(1 - p, 4);
            scoreText.textContent =
              String(Math.round(target * eased)).padStart(5, '0');
            if (p < 1) requestAnimationFrame(rollUp);
          };
          requestAnimationFrame(rollUp);
        }
      }
      if (userText) {
        var boxWidth = 470;
        var baseSize = 22, minSize = 11;
        var fitName = function () {
          var name = username;
          var fontSize = baseSize;
          userText.textContent = name;
          userText.setAttribute('font-size', String(fontSize));
          var guard = 0;
          while (userText.getComputedTextLength() > boxWidth && fontSize > minSize && guard++ < 100) {
            fontSize -= 0.5;
            userText.setAttribute('font-size', String(fontSize));
          }
          if (userText.getComputedTextLength() > boxWidth) {
            // Minimum size reached and the name still overflows.  The display
            // font is proportional, so a fixed per-character width guess is
            // wrong -- wide uppercase glyphs overrun it.  Measure the real
            // rendered width of each candidate until it actually fits.
            var n = name.length, k = 0;
            while (n > 1 && k++ < 200) {
              n -= 1;
              var candidate = name.slice(0, n) + '…';
              userText.textContent = candidate;
              if (userText.getComputedTextLength() <= boxWidth) break;
            }
            userText.textContent = name.slice(0, n) + '…';
          }
        };
        fitName();
        // Re-fit once the webfont really is loaded: measuring before that
        // uses the fallback font, so getComputedTextLength() can lie.
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(fitName);
        }
      }
    })();
  </script>
