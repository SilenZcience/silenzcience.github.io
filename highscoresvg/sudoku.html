<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku High Score — Silas Kraume</title>
  <meta name="description" content="Sudoku high score">
  <meta name="theme-color" content="#141413">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23141413'/%3E%3Crect x='10' y='10' width='44' height='44' fill='none' stroke='%23BC9C62' stroke-width='5'/%3E%3Ccircle cx='43' cy='43' r='7' fill='%23BC9C62'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141413;
      --bg-2: #1B1B19;
      --ink: #EDEBE6;
      --dim: #908E86;
      --faint: #5F5D57;
      --accent: #BC9C62;
      --line: rgba(237,235,230,0.08);
      --line-2: rgba(237,235,230,0.22);
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", "Courier New", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .card { width: 100%; max-width: 520px; }
    .svg-card {
      width: 100%; height: auto; display: block;
      border: 1px solid var(--line-2);
      background: radial-gradient(120% 120% at 50% 0%, var(--bg-2) 0%, var(--bg) 100%);
      box-shadow: 0 40px 80px -60px rgba(188, 156, 98, 0.4);
    }
    .play-btn {
      display: block; width: 100%;
      margin-top: 14px; padding: 14px 17px;
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: .16em; text-transform: uppercase;
      color: var(--dim); background: none;
      border: 1px solid var(--line-2);
      text-align: center; text-decoration: none;
      cursor: pointer; user-select: none; -webkit-user-select: none;
      transition: background .2s ease, color .2s ease, border-color .2s ease;
    }
    .play-btn:hover {
      background: var(--ink); color: var(--bg); border-color: var(--ink);
    }

    @keyframes scoreGlow {
      0%, 100% { opacity: .04; }
      50%      { opacity: .11; }
    }
    @keyframes sheen {
      0%       { transform: translateX(-160px); opacity: 0; }
      12%      { opacity: .05; }
      50%      { opacity: .05; }
      88%      { opacity: 0; }
      100%     { transform: translateX(560px); opacity: 0; }
    }
    /* --- Right-side gamefield show --------------------------------
       One shared 11s cycle: a gold cursor rasters all 81 cells, each
       missing digit springs in with a gold flash the moment the cursor
       lands, every finished row sweeps a shine bar, then the solved
       board celebrates (flare, flash, triple shockwave,
       confetti, sparkle stars, a border that draws itself and a group
       bounce) and dissolves digit-by-digit back to the givens.
       Per-cell --d delays carry the stagger; digits use a negative
       delay so their phase is right from the first frame.            */
    @keyframes cursorRun {
      0%      { transform: translate(336px, 78px); opacity: 0; }
      3.6364% { transform: translate(336px, 78px); opacity: 1; }
      4.1414% { transform: translate(352px, 78px); opacity: 1; }
      4.6465% { transform: translate(368px, 78px); opacity: 1; }
      5.1515% { transform: translate(384px, 78px); opacity: 1; }
      5.6566% { transform: translate(400px, 78px); opacity: 1; }
      6.1616% { transform: translate(416px, 78px); opacity: 1; }
      6.6667% { transform: translate(432px, 78px); opacity: 1; }
      7.1717% { transform: translate(448px, 78px); opacity: 1; }
      7.6768% { transform: translate(464px, 78px); opacity: 1; }
      8.1818% { transform: translate(336px, 94px); opacity: 1; }
      8.6869% { transform: translate(352px, 94px); opacity: 1; }
      9.1919% { transform: translate(368px, 94px); opacity: 1; }
      9.6970% { transform: translate(384px, 94px); opacity: 1; }
      10.2020% { transform: translate(400px, 94px); opacity: 1; }
      10.7071% { transform: translate(416px, 94px); opacity: 1; }
      11.2121% { transform: translate(432px, 94px); opacity: 1; }
      11.7172% { transform: translate(448px, 94px); opacity: 1; }
      12.2222% { transform: translate(464px, 94px); opacity: 1; }
      12.7273% { transform: translate(336px, 110px); opacity: 1; }
      13.2323% { transform: translate(352px, 110px); opacity: 1; }
      13.7374% { transform: translate(368px, 110px); opacity: 1; }
      14.2424% { transform: translate(384px, 110px); opacity: 1; }
      14.7475% { transform: translate(400px, 110px); opacity: 1; }
      15.2525% { transform: translate(416px, 110px); opacity: 1; }
      15.7576% { transform: translate(432px, 110px); opacity: 1; }
      16.2626% { transform: translate(448px, 110px); opacity: 1; }
      16.7677% { transform: translate(464px, 110px); opacity: 1; }
      17.2727% { transform: translate(336px, 126px); opacity: 1; }
      17.7778% { transform: translate(352px, 126px); opacity: 1; }
      18.2828% { transform: translate(368px, 126px); opacity: 1; }
      18.7879% { transform: translate(384px, 126px); opacity: 1; }
      19.2929% { transform: translate(400px, 126px); opacity: 1; }
      19.7980% { transform: translate(416px, 126px); opacity: 1; }
      20.3030% { transform: translate(432px, 126px); opacity: 1; }
      20.8081% { transform: translate(448px, 126px); opacity: 1; }
      21.3131% { transform: translate(464px, 126px); opacity: 1; }
      21.8182% { transform: translate(336px, 142px); opacity: 1; }
      22.3232% { transform: translate(352px, 142px); opacity: 1; }
      22.8283% { transform: translate(368px, 142px); opacity: 1; }
      23.3333% { transform: translate(384px, 142px); opacity: 1; }
      23.8384% { transform: translate(400px, 142px); opacity: 1; }
      24.3434% { transform: translate(416px, 142px); opacity: 1; }
      24.8485% { transform: translate(432px, 142px); opacity: 1; }
      25.3535% { transform: translate(448px, 142px); opacity: 1; }
      25.8586% { transform: translate(464px, 142px); opacity: 1; }
      26.3636% { transform: translate(336px, 158px); opacity: 1; }
      26.8687% { transform: translate(352px, 158px); opacity: 1; }
      27.3737% { transform: translate(368px, 158px); opacity: 1; }
      27.8788% { transform: translate(384px, 158px); opacity: 1; }
      28.3838% { transform: translate(400px, 158px); opacity: 1; }
      28.8889% { transform: translate(416px, 158px); opacity: 1; }
      29.3939% { transform: translate(432px, 158px); opacity: 1; }
      29.8990% { transform: translate(448px, 158px); opacity: 1; }
      30.4040% { transform: translate(464px, 158px); opacity: 1; }
      30.9091% { transform: translate(336px, 174px); opacity: 1; }
      31.4141% { transform: translate(352px, 174px); opacity: 1; }
      31.9192% { transform: translate(368px, 174px); opacity: 1; }
      32.4242% { transform: translate(384px, 174px); opacity: 1; }
      32.9293% { transform: translate(400px, 174px); opacity: 1; }
      33.4343% { transform: translate(416px, 174px); opacity: 1; }
      33.9394% { transform: translate(432px, 174px); opacity: 1; }
      34.4444% { transform: translate(448px, 174px); opacity: 1; }
      34.9495% { transform: translate(464px, 174px); opacity: 1; }
      35.4545% { transform: translate(336px, 190px); opacity: 1; }
      35.9596% { transform: translate(352px, 190px); opacity: 1; }
      36.4646% { transform: translate(368px, 190px); opacity: 1; }
      36.9697% { transform: translate(384px, 190px); opacity: 1; }
      37.4747% { transform: translate(400px, 190px); opacity: 1; }
      37.9798% { transform: translate(416px, 190px); opacity: 1; }
      38.4848% { transform: translate(432px, 190px); opacity: 1; }
      38.9899% { transform: translate(448px, 190px); opacity: 1; }
      39.4949% { transform: translate(464px, 190px); opacity: 1; }
      40.0000% { transform: translate(336px, 206px); opacity: 1; }
      40.5051% { transform: translate(352px, 206px); opacity: 1; }
      41.0101% { transform: translate(368px, 206px); opacity: 1; }
      41.5152% { transform: translate(384px, 206px); opacity: 1; }
      42.0202% { transform: translate(400px, 206px); opacity: 1; }
      42.5253% { transform: translate(416px, 206px); opacity: 1; }
      43.0303% { transform: translate(432px, 206px); opacity: 1; }
      43.5354% { transform: translate(448px, 206px); opacity: 1; }
      44.0404% { transform: translate(464px, 206px); opacity: 1; }
      54.5%    { transform: translate(464px, 206px); opacity: 1; }
      58%      { transform: translate(464px, 206px); opacity: 0; }
      100%      { transform: translate(336px, 78px); opacity: 0; }
    }
    @keyframes solvePop {
      0%     { opacity: 0; transform: scale(.15) rotate(-9deg); fill: #FFF6E4;
               filter: brightness(2.6) drop-shadow(0 0 5px rgba(255,238,195,.95)); }
      0.9%   { opacity: 1; transform: scale(1.38) rotate(5deg); }
      1.7%   { transform: scale(1.05) rotate(-2.5deg); fill: #F2DDAC; }
      2.9%   { transform: scale(1) rotate(0deg); fill: #D8B87E;
               filter: brightness(1.3) drop-shadow(0 0 2px rgba(240,222,174,.55)); }
      5.4%   { fill: #BC9C62; filter: none; }
      50.9%  { opacity: 1; transform: scale(1) rotate(0deg); filter: none; }
      52.3%  { opacity: 1; transform: scale(1.14) rotate(3deg); filter: brightness(1.6); }
      53.6%  { opacity: 0; transform: scale(.1) rotate(-6deg); filter: none; }
      100%   { opacity: 0; transform: scale(.1) rotate(-6deg); fill: #BC9C62; filter: none; }
    }
    /* gold shine wipes across a row the moment its last digit lands */
    @keyframes rowSweep {
      0%     { opacity: 0; transform: translateX(-158px); }
      0.8%   { opacity: .85; }
      5%     { opacity: .6; }
      6.4%   { opacity: 0; transform: translateX(158px); }
      100%   { opacity: 0; transform: translateX(158px); }
    }
    /* --- the solved-board celebration, fired at ~46.5% --- */
    @keyframes celShake {
      0%, 46.4% { transform: translate(0, 0); }
      46.9% { transform: translate(2.4px, -1.8px); }
      47.4% { transform: translate(-2.2px, 1.5px); }
      47.9% { transform: translate(1.6px, -1px); }
      48.4% { transform: translate(-1px, 0.8px); }
      48.9% { transform: translate(0.4px, -0.3px); }
      49.4%, 100% { transform: translate(0, 0); }
    }
    @keyframes celFlare {
      0%, 46.2%  { opacity: 0; transform: scale(.6); }
      47.6%     { opacity: .5; transform: scale(1); }
      52%       { opacity: .3; transform: scale(1.18); }
      58%, 100% { opacity: 0; transform: scale(1.3); }
    }
    @keyframes celFlash {
      0%, 46.3%  { opacity: 0; transform: scale(.3); }
      47.4%     { opacity: .95; transform: scale(.85); }
      50%       { opacity: .45; transform: scale(1.6); }
      54%, 100% { opacity: 0; transform: scale(2.3); }
    }
    @keyframes celRing {
      0%, 46.5%  { opacity: 0; transform: scale(.25); }
      47.8%     { opacity: .9; transform: scale(.55); }
      53%       { opacity: .45; transform: scale(1.5); }
      58%, 100% { opacity: 0; transform: scale(2.1); }
    }
    @keyframes celBand {
      0%, 46.4%  { opacity: 0; transform: translateY(-46px); }
      47.2%     { opacity: .85; }
      53.5%     { opacity: .3; }
      56.5%     { opacity: 0; transform: translateY(168px); }
      100%      { opacity: 0; transform: translateY(168px); }
    }
    @keyframes celBorder {
      0%, 46.35% { opacity: 0; stroke-dashoffset: 580; }
      46.45%  { opacity: 1; }
      51%     { opacity: 1; stroke-dashoffset: 0; }
      56%     { opacity: 0; stroke-dashoffset: 0; }
      100%    { opacity: 0; stroke-dashoffset: 580; }
    }
    @keyframes celPulse {
      0%, 46.3%  { transform: scale(1); }
      47.8%     { transform: scale(1.05); }
      49.6%     { transform: scale(.985); }
      51.6%, 100% { transform: scale(1); }
    }
    @keyframes confetti {
      0%, 46.4% { opacity: 0; transform: translate(0, 0) rotate(0deg) scale(.5); }
      47.4%    { opacity: 1; transform: translate(calc(var(--dx) * .25), calc(var(--dy) * .25)) rotate(calc(var(--rot) * .3)) scale(1.2); }
      52%      { opacity: 1; transform: translate(calc(var(--dx) * .7), calc(var(--dy) * .7)) rotate(calc(var(--rot) * .8)) scale(1.05); }
      57.5%    { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(.45); }
      100%     { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(.45); }
    }
    @keyframes starPop {
      0%, 46.8% { opacity: 0; transform: scale(.2) rotate(0deg); }
      48.5%    { opacity: .95; transform: scale(1.3) rotate(70deg); }
      51.5%    { opacity: .5; transform: scale(.85) rotate(120deg); }
      55%      { opacity: 0; transform: scale(.25) rotate(170deg); }
      100%     { opacity: 0; transform: scale(.2) rotate(170deg); }
    }

    @keyframes boardIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .score-glow { animation: scoreGlow 6s ease-in-out infinite; }
    .sheen      { animation: sheen 11s ease-in-out infinite; }
    .cursor     { opacity: 0; animation: cursorRun 11s linear infinite; }
    .sd         { fill: #BC9C62; transform-box: fill-box; transform-origin: center;
                   animation: solvePop 11s linear infinite; animation-delay: var(--d, 0s); }
    .row-sw     { opacity: 0; animation: rowSweep 11s linear infinite; animation-delay: var(--d, 0s); }
    .cel-shake  { animation: celShake 11s ease-out infinite; }
    .cel-pulse  { transform-box: fill-box; transform-origin: center;
                   animation: celPulse 11s ease-out infinite; }
    .cel-flare  { opacity: 0; transform-box: fill-box; transform-origin: center;
                   animation: celFlare 11s ease-out infinite; }
    .cel-flash  { opacity: 0; transform-box: fill-box; transform-origin: center;
                   animation: celFlash 11s ease-out infinite; }
    .cel-ring   { opacity: 0; transform-box: fill-box; transform-origin: center;
                   animation: celRing 11s ease-out infinite; animation-delay: var(--sd, 0s); }
    .cel-band   { opacity: 0; animation: celBand 11s linear infinite; }
    .cel-border { opacity: 0; stroke-dasharray: 580; stroke-dashoffset: 580;
                   animation: celBorder 11s linear infinite; }
    .fx-c       { opacity: 0; transform-box: fill-box; transform-origin: center;
                   animation: confetti 11s ease-out infinite; }
    .fx-star    { opacity: 0; transform-box: fill-box; transform-origin: center;
                   animation: starPop 11s ease-out infinite; animation-delay: var(--sd, 0s); }
    .board-fade { animation: boardIn 2.4s ease-out forwards; }

    @media (prefers-reduced-motion: reduce) {
      .score-glow, .sheen, .board-fade, .cursor, .sd, .row-sw,
      .cel-shake, .cel-pulse, .cel-flare, .cel-flash, .cel-ring,
      .cel-band, .cel-border, .fx-c, .fx-star { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <svg class="svg-card" viewBox="0 0 520 260" role="img" aria-label="Sudoku high score">
      <defs>
        <radialGradient id="g" cx="50%" cy="0%" r="120%">
          <stop offset="0%" stop-color="#1F1F1B" stop-opacity="1" />
          <stop offset="100%" stop-color="#141413" stop-opacity="1" />

        <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">

  <script src="../share-utils.js"></script>
  <script>
    (function () {
      function getParam(name) {
        var url = new URL(window.location.href);
        return url.searchParams.get(name);
      }

      var diffLabels = { easy: 'Easy', medium: 'Medium', hard: 'Hard', evil: 'Expert' };

      var username = getParam('username') || 'Anonymous';
      var time = Math.max(0, parseInt(getParam('time'), 10) || 0);
      var difficulty = getParam('difficulty') || '';
      var mistakes = getParam('mistakes') || '';
      var token = getParam('t');
      if (token) {
        try {
          var data = deobfuscateShare(token);
          if (data && typeof data.n !== 'undefined' && typeof data.s !== 'undefined') {
            username = String(data.n).slice(0, 60);
            time = Math.max(0, Math.floor(Number(data.s) || 0));
            if (data.d) difficulty = String(data.d);
            if (typeof data.m !== 'undefined') mistakes = String(data.m);
          }
        } catch (e) {}
      }

      var titleText = document.getElementById('titleText');
      if (titleText && difficulty && diffLabels[difficulty]) {
        titleText.textContent = diffLabels[difficulty] + ' Sudoku High Score';
      }

      var scoreText = document.getElementById('scoreText');
      if (scoreText) {
        var hh = Math.floor(time / 3600);
        var mm = Math.floor((time % 3600) / 60);
        var ss = time % 60;
        scoreText.textContent = hh + ':' + (mm < 10 ? '0' + mm : mm) + ':' + (ss < 10 ? '0' + ss : ss);
        // Keep the H:MM:SS string clear of the Mistakes/Player column if it gets wide.
        var fs = 52, minFs = 30, boxW = 224;
        scoreText.setAttribute('font-size', String(fs));
        while (scoreText.getComputedTextLength() > boxW && fs > minFs) {
          fs -= 0.5; scoreText.setAttribute('font-size', String(fs));
        }
      }

      var mistText = document.getElementById('mistText');
      if (mistText) {
        var mNum = String(mistakes).replace(/[^0-9]/g, '');
        mistText.textContent = mNum ? String(parseInt(mNum, 10)) : '—';
        var mSize = 22, mBox = 96;
        mistText.setAttribute('font-size', String(mSize));
        var mGuard = 0;
        while (mistText.getComputedTextLength() > mBox && mSize > 12 && mGuard++ < 50) {
          mSize -= 0.5; mistText.setAttribute('font-size', String(mSize));
        }
      }

      var userText = document.getElementById('userText');
      if (userText) {
        var boxWidth = 380;
        var baseSize = 22, minSize = 11;
        var fitName = function () {
          var name = username;
          var fontSize = baseSize;
          userText.textContent = name;
          userText.setAttribute('font-size', String(fontSize));
          var guard = 0;
          while (userText.getComputedTextLength() > boxWidth && fontSize > minSize && guard++ < 100) {
            fontSize -= 0.5;
            userText.setAttribute('font-size', String(fontSize));
          }
          if (userText.getComputedTextLength() > boxWidth) {
            // Minimum size reached and the name still overflows.  The display
            // font is proportional, so a fixed per-character width guess is
            // wrong -- wide uppercase glyphs overrun it.  Measure the real
            // rendered width of each candidate until it actually fits.
            var n = name.length, k = 0;
            while (n > 1 && k++ < 200) {
              n -= 1;
              var candidate = name.slice(0, n) + '…';
              userText.textContent = candidate;
              if (userText.getComputedTextLength() <= boxWidth) break;
            }
            userText.textContent = name.slice(0, n) + '…';
          }
        };
        fitName();
        // Re-fit once the webfont really is loaded: measuring before that
        // uses the fallback font, so getComputedTextLength() can lie.
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(fitName);
        }
      }
    })();
  </script>
