<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typing Velocity High Score — Silas Kraume</title>
  <meta name="description" content="Typing velocity high score">
  <meta name="theme-color" content="#141413">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23141413'/%3E%3Crect x='10' y='10' width='44' height='44' fill='none' stroke='%23BC9C62' stroke-width='5'/%3E%3Ccircle cx='43' cy='43' r='7' fill='%23BC9C62'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141413;
      --bg-2: #1B1B19;
      --ink: #EDEBE6;
      --dim: #908E86;
      --faint: #5F5D57;
      --accent: #BC9C62;
      --line: rgba(237,235,230,0.08);
      --line-2: rgba(237,235,230,0.22);
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", "Courier New", monospace;
      --sheen-peak: 0.05;
      --scoreglow-peak: 0.11;
      --celflare-peak: 0.5;
      --celflash-peak: 0.5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .card { width: 100%; max-width: 520px; }
    .svg-card {
      width: 100%; height: auto; display: block;
      border: 1px solid var(--line-2);
      background: radial-gradient(120% 120% at 50% 0%, var(--bg-2) 0%, var(--bg) 100%);
      box-shadow: 0 40px 80px -60px rgba(188, 156, 98, 0.4);
    }
    .play-btn {
      display: block; width: 100%;
      margin-top: 14px; padding: 14px 17px;
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: .16em; text-transform: uppercase;
      color: var(--dim); background: none;
      border: 1px solid var(--line-2);
      text-align: center; text-decoration: none;
      cursor: pointer; user-select: none; -webkit-user-select: none;
      transition: background .2s ease, color .2s ease, border-color .2s ease;
    }
    .play-btn:hover {
      background: var(--ink); color: var(--bg); border-color: var(--ink);
    }

    @keyframes scoreGlow {
      0%, 100% { opacity: .04; }
      50%      { opacity: var(--scoreglow-peak); }
    }
    @keyframes sheen {
      0%       { transform: translateX(-160px); opacity: 0; }
      12%      { opacity: var(--sheen-peak); }
      50%      { opacity: var(--sheen-peak); }
      88%      { opacity: 0; }
      100%     { transform: translateX(560px); opacity: 0; }
    }
    @keyframes bash {
      0%   { transform: translate(0, -3px) scale(1.65) rotate(-3deg); fill: #FFFFFF; }
      16%  { transform: translate(-1.3px, 1px) scale(0.86) rotate(2.5deg); }
      34%  { transform: translate(1.3px, -0.7px) scale(1.3) rotate(-2deg); fill: #F5EFE3; }
      52%  { transform: translate(-1px, 0.5px) scale(1.06) rotate(1.5deg); }
      70%  { transform: translate(0.7px, -0.35px) scale(1.16) rotate(-1deg); }
      86%  { transform: translate(-0.35px, 0.18px) scale(1.03) rotate(0.5deg); }
      100% { transform: translate(0, 0) scale(1) rotate(0deg); fill: #EDEBE6; }
    }
    @keyframes dust {
      0%   { opacity: .85; transform: scale(1) translate(0, 0); }
      100% { opacity: 0; transform: scale(0.2) translate(var(--dx, 8px), var(--dy, -10px)); }
    }
    @keyframes sparkleFloat {
      0%   { opacity: 0; transform: scale(0) translate(0, 0) rotate(0deg); }
      18%  { opacity: 1; transform: scale(1) translate(0, 0) rotate(0deg); }
      100% { opacity: 0; transform: scale(0.2) translate(var(--dx, 10px), var(--dy, -20px)) rotate(var(--rot, 90deg)); }
    }
    @keyframes burst {
      0%   { opacity: .5; transform: scale(0.2); }
      100% { opacity: 0; transform: scale(1.7); }
    }

    .score-glow { animation: scoreGlow 6s ease-in-out infinite; }
    .sheen      { animation: sheen 11s ease-in-out infinite; }

    #textGroup { font-family: var(--font-mono); font-size: 14px; }

    .ghost   { fill: #5F5D57; opacity: 0.5; }
    .typed   { fill: #BC9C62; opacity: 1; }
    .current { opacity: 0; fill: #BC9C62; fill-opacity: 0; }  /* hidden while the hero letter performs the strike */

    /* Each struck letter is its own transformable <text> so the key-bashes can
       overlap while the caret runs on ahead. */
    #trails, #heroes, #sparkles { pointer-events: none; }
    .hero, .dust, .sparkle, .burst { will-change: transform, opacity; }

    .hero {
      fill: #EDEBE6;
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 600;
      transform-box: fill-box;
      transform-origin: 50% 88%;
    }
    .hero.bash { animation: bash 0.14s cubic-bezier(.18,.82,.28,1) both; }

    .dust { transform-box: fill-box; transform-origin: center; }
    .dust.animate { animation: dust 0.5s ease-out forwards; }

    .sparkle { opacity: 0; transform-box: fill-box; transform-origin: center; }
    .sparkle.animate { animation: sparkleFloat 0.9s ease-out forwards; }

    .burst { opacity: 0; transform-box: fill-box; transform-origin: center; }
    .burst.animate { animation: burst 0.7s ease-out forwards; }

    @media (prefers-reduced-motion: reduce) {
      .score-glow, .sheen, .dust.animate, .sparkle.animate, .burst.animate { animation: none; }
      #heroes { display: none; }
      .current { opacity: 1; fill: #EDEBE6; fill-opacity: 1; }
    }
    @media (dynamic-range: high) {
      :root {
        --sheen-peak: 0.028;
        --scoreglow-peak: 0.07;
        --celflare-peak: 0.34;
        --celflash-peak: 0.34;
      }
    }
  </style>
</head>

  <script>
    (function () {
      function getParam(name) {
        var url = new URL(window.location.href);
        return url.searchParams.get(name);
      }

      var username = getParam('username') || 'Anonymous';
      var highscore = getParam('highscore') || '0';
      var accuracy = getParam('accuracy') || '';
      var token = getParam('t');
      if (token) {
        try {
          var data = deobfuscateShare(token);
          if (data && typeof data.n !== "undefined" && typeof data.s !== "undefined") {
            username = String(data.n).slice(0, 60);
            highscore = String(data.s);
            if (typeof data.a !== "undefined") accuracy = String(data.a);
          }
        } catch (e) {}
      }
      var userText = document.getElementById('userText');
      var scoreText = document.getElementById('scoreText');
      var accText = document.getElementById('accText');
      if (scoreText) {
        var digits = String(highscore).replace(/[^0-9]/g, '') || '0';
        scoreText.textContent = String(parseInt(digits, 10)).padStart(3, '0');
      }
      if (accText) {
        var apct = String(accuracy).replace(/[^0-9]/g, '');
        accText.textContent = apct ? Math.min(100, parseInt(apct, 10)) + '%' : '—';
        var aSize = 22;
        var aBox = 96;
        accText.setAttribute('font-size', String(aSize));
        var g2 = 0;
        while (accText.getComputedTextLength() > aBox && aSize > 12 && g2++ < 50) {
          aSize -= 0.5;
          accText.setAttribute('font-size', String(aSize));
        }
      }
      if (userText) {
        var boxWidth = 380;
        var baseSize = 22, minSize = 11;
        var fitName = function () {
          var name = username;
          var fontSize = baseSize;
          userText.textContent = name;
          userText.setAttribute('font-size', String(fontSize));
          var guard = 0;
          while (userText.getComputedTextLength() > boxWidth && fontSize > minSize && guard++ < 100) {
            fontSize -= 0.5;
            userText.setAttribute('font-size', String(fontSize));
          }
          if (userText.getComputedTextLength() > boxWidth) {
            var n = name.length, k = 0;
            while (n > 1 && k++ < 200) {
              n -= 1;
              var candidate = name.slice(0, n) + '…';
              userText.textContent = candidate;
              if (userText.getComputedTextLength() <= boxWidth) break;
            }
            userText.textContent = name.slice(0, n) + '…';
          }
        };
        fitName();
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(fitName);
        }
      }
    })();
  </script>
  <script>
    (function() {
      "use strict";
      var SVGNS = "http://www.w3.org/2000/svg";
      var chars = Array.prototype.slice.call(document.querySelectorAll("#textGroup .char"));
      var textGroup = document.getElementById("textGroup");
      var heroesGroup = document.getElementById("heroes");
      var cursor = document.getElementById("cursor");
      var sparklesGroup = document.getElementById("sparkles");

      var total = chars.length;
      var index = 0;
      var cursorPos = { x: 260, y: 145 };
      var startPos = { x: 260, y: 145 };
      var completed = false;
      var started = false;
      var pendingReveals = [];

      var reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

      var WARP_MIN = 28, WARP_MAX = 200, HOLD = 30, BASH_MS = 140;

      var smear = document.getElementById("smear");
      var smearGrad = document.getElementById("smearGrad");
      var trailLast = null;
      var smearAnimId = null;
      var smearRunning = false;

      function lineY(i) {
        return parseFloat(chars[i].parentElement.getAttribute("y")) || 0;
      }

      // NOTE: tspan.getBBox() reports coordinates in the SVG's own user space
      // (i.e. already absolute), so the line's x/y must NOT be added again.
      function getCharPos(i) {
        if (i < 0 || i >= total) return { x: cursorPos.x, y: cursorPos.y };
        var bbox = chars[i].getBBox();
        return { x: bbox.x, y: lineY(i) - 12 };
      }

      function setCursor(x, y) {
        cursor.setAttribute("x", x.toFixed(2));
        cursor.setAttribute("y", y.toFixed(2));
      }

      function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      // A simple motion-blur attached to the caret: a gradient box to its left
      // that fades out to transparent - longer/brighter as the caret moves faster.
      function drawSmear(x, y, L, op) {
        var top = y, height = 14;
        var right = x + 2, left = right - L;
        if (left < 0) left = 0;
        var w = right - left;
        var lx = Math.round(left);
        var rx = Math.round(right);
        var ty = Math.round(top);
        var h  = Math.round(height);
        var ww = Math.round(w);
        smear.setAttribute("x", lx);
        smear.setAttribute("y", ty);
        smear.setAttribute("width", ww);
        smear.setAttribute("height", h);
        smearGrad.setAttribute("x1", lx);
        smearGrad.setAttribute("y1", ty);
        smearGrad.setAttribute("x2", rx);
        smearGrad.setAttribute("y2", ty);
        smear.setAttribute("opacity", op.toFixed(3));
      }

      function pushTrail(x, y, dirX, dirY) {
        if (reduceMotion) return;
        if (trailLast) {
          var vx = x - trailLast.x, vy = y - trailLast.y;
          var d = Math.sqrt(vx * vx + vy * vy);
          if (d < 0.25) { trailLast = { x: x, y: y }; return; }
          if (d > 0.3) {
            drawSmear(x, y, Math.max(12, Math.min(44, d * 6 + 8)), Math.min(0.8, 0.3 + d * 0.08));
          } else {
            drawSmear(x, y, 26, 0.5);
          }
        } else {
          drawSmear(x, y, 26, 0.5);
        }
        trailLast = { x: x, y: y };
      }

      // When the caret settles, ease the smear away.
      function fadeTrailOut() {
        if (reduceMotion) { trailLast = null; return; }
        var o0 = parseFloat(smear.getAttribute("opacity")) || 0;
        var t0 = performance.now(), dur = 150;
        function f(now) {
          var p = Math.min(1, (now - t0) / dur);
          smear.setAttribute("opacity", (o0 * (1 - p)).toFixed(3));
          if (p < 1) requestAnimationFrame(f);
          else {
            trailLast = null;
            smear.setAttribute("width", "0");
            smear.setAttribute("opacity", "0");
          }
        }
        requestAnimationFrame(f);
      }

      // Smooth warp, never a teleport. Long jumps - line wraps, the return to
      // the start - travel visibly and leave the comet trail behind.
      function warpTo(target, done) {
        var fromX = cursorPos.x, fromY = cursorPos.y;
        var dx = target.x - fromX, dy = target.y - fromY;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var dur = reduceMotion ? 1 : Math.max(WARP_MIN, Math.min(WARP_MAX, dist));
        if (dist < 0.4) {
          cursorPos.x = target.x;
          cursorPos.y = target.y;
          setCursor(target.x, target.y);
          fadeTrailOut();
          if (done) requestAnimationFrame(done);
          return;
        }
        var t0 = performance.now();
        function step(now) {
          var p = Math.min(1, (now - t0) / dur);
          var e = easeInOutCubic(p);
          var x = fromX + dx * e;
          var y = fromY + dy * e;
          cursorPos.x = x;
          cursorPos.y = y;
          setCursor(x, y);
          pushTrail(x, y, dx, dy);
          if (p < 1) {
            requestAnimationFrame(step);
          } else {
            cursorPos.x = target.x;
            cursorPos.y = target.y;
            setCursor(target.x, target.y);
            fadeTrailOut();
            if (done) done();
          }
        }
        requestAnimationFrame(step);
      }

      // The caret has landed: hide the plain glyph and drop a temporary "hero"
      // copy of the letter that takes the hit. Bashes overlap, so the caret can
      // move on while the previous letters are still settling.
      function strike(i) {
        var c = chars[i];
        c.classList.remove("ghost");
        c.classList.add("current"); // hidden while the hero performs

        var pos = getCharPos(i);
        var t = document.createElementNS(SVGNS, "text");
        t.setAttribute("class", "hero");
        t.setAttribute("x", pos.x.toFixed(2));
        t.setAttribute("y", lineY(i));
        t.textContent = chars[i].textContent;
        heroesGroup.appendChild(t);
        requestAnimationFrame(function() { t.classList.add("bash"); });

        var id = setTimeout(function() {
          c.classList.remove("current");
          c.classList.add("typed");
          if (t.parentNode) t.parentNode.removeChild(t);
          var k = pendingReveals.indexOf(id);
          if (k > -1) pendingReveals.splice(k, 1);
        }, BASH_MS);
        pendingReveals.push(id);

        kickDust(i);
      }

      // A little debris kicked up by the key-bash.
      function kickDust(i) {
        if (reduceMotion) return;
        var x = getCharPos(i).x + 1;
        var y = lineY(i) - 2;
        for (var k = 0; k < 3; k++) {
          (function(k) {
            setTimeout(function() {
              var g = document.createElementNS(SVGNS, "g");
              g.setAttribute("transform", "translate(" + x.toFixed(1) + "," + y.toFixed(1) + ")");
              var dot = document.createElementNS(SVGNS, "circle");
              dot.setAttribute("cx", "0");
              dot.setAttribute("cy", "0");
              dot.setAttribute("r", (0.5 + Math.random() * 0.8).toFixed(2));
              dot.setAttribute("fill", Math.random() < 0.5 ? "#BC9C62" : "#EDEBE6");
              dot.classList.add("dust");
              dot.style.setProperty("--dx", (Math.random() * 12 - 6).toFixed(1) + "px");
              dot.style.setProperty("--dy", (-Math.random() * 12 - 3).toFixed(1) + "px");
              g.appendChild(dot);
              sparklesGroup.appendChild(g);
              requestAnimationFrame(function() { dot.classList.add("animate"); });
              setTimeout(function() { if (g.parentNode) g.parentNode.removeChild(g); }, 560);
            }, k * 16);
          })(k);
        }
      }

      function pastEndPos(i) {
        var w = chars[i].getComputedTextLength ? chars[i].getComputedTextLength() : 8;
        return { x: getCharPos(i).x + w, y: lineY(i) - 12 };
      }

      function typeNext() {
        if (index >= total) {
          // settle the caret just past the final letter, then celebrate
          warpTo(pastEndPos(total - 1), finishRun);
          return;
        }
        var i = index;
        warpTo(getCharPos(i), function() {
          strike(i);
          index++;
          setTimeout(typeNext, HOLD);
        });
      }

      function finishRun() {
        completed = true;
        celebrate();
        setTimeout(returnHome, 1500);
      }

      function starPath(s) {
        var p = [[0, -4], [1.1, -1.1], [4, 0], [1.1, 1.1], [0, 4], [-1.1, 1.1], [-4, 0], [-1.1, -1.1]];
        var out = [];
        for (var i = 0; i < p.length; i++) {
          out.push((i ? "L" : "M") + (p[i][0] * s).toFixed(2) + "," + (p[i][1] * s).toFixed(2));
        }
        return out.join(" ") + " Z";
      }

      function spawnSparkle(x, y, star, s, fill, dx, dy, rot, life) {
        var g = document.createElementNS(SVGNS, "g");
        g.setAttribute("transform", "translate(" + x.toFixed(1) + "," + y.toFixed(1) + ")");
        var el = document.createElementNS(SVGNS, star ? "path" : "circle");
        if (star) {
          el.setAttribute("d", starPath(s));
        } else {
          el.setAttribute("cx", "0");
          el.setAttribute("cy", "0");
          el.setAttribute("r", s.toFixed(2));
        }
        el.setAttribute("fill", fill);
        el.classList.add("sparkle");
        el.style.setProperty("--dx", dx.toFixed(1) + "px");
        el.style.setProperty("--dy", dy.toFixed(1) + "px");
        el.style.setProperty("--rot", (rot || 0) + "deg");
        g.appendChild(el);
        sparklesGroup.appendChild(g);
        requestAnimationFrame(function() { el.classList.add("animate"); });
        setTimeout(function() { if (g.parentNode) g.parentNode.removeChild(g); }, life);
      }

      function celebrate() {
        var bb = textGroup.getBBox();
        var padX = 8, padY = 10;
        // A soft accent bloom at the caret...
        var ring = document.createElementNS(SVGNS, "circle");
        ring.setAttribute("cx", (cursorPos.x + 1).toFixed(1));
        ring.setAttribute("cy", (cursorPos.y + 7).toFixed(1));
        ring.setAttribute("r", "24");
        ring.setAttribute("fill", "url(#accentGlow)");
        ring.classList.add("burst");
        sparklesGroup.appendChild(ring);
        requestAnimationFrame(function() { ring.classList.add("animate"); });
        setTimeout(function() { if (ring.parentNode) ring.parentNode.removeChild(ring); }, 800);

        var palette = ["#BC9C62", "#EDEBE6", "#E7C98A", "#D9BC82"];
        for (var i = 0; i < 32; i++) {
          (function(i) {
            setTimeout(function() {
              var x = bb.x - padX + Math.random() * (bb.width + padX * 2);
              var y = bb.y - padY + Math.random() * (bb.height + padY * 2);
              var star = Math.random() < 0.5;
              spawnSparkle(
                x, y, star,
                star ? (0.5 + Math.random() * 0.9) : (0.7 + Math.random() * 1.7),
                palette[(Math.random() * palette.length) | 0],
                Math.random() * 44 - 22,
                -6 - Math.random() * 34,
                Math.random() * 200 - 100,
                950
              );
            }, i * 22);
          })(i);
        }
      }

      // Warp back to the start instead of snapping, then lay the words down again.
      function returnHome() {
        warpTo(startPos, function() {
          // cancel anything still in flight from the previous run
          for (var p = 0; p < pendingReveals.length; p++) clearTimeout(pendingReveals[p]);
          pendingReveals = [];
          while (heroesGroup.firstChild) heroesGroup.removeChild(heroesGroup.firstChild);
          for (var i = 0; i < chars.length; i++) {
            chars[i].classList.remove("typed", "current");
            chars[i].classList.add("ghost");
          }
          index = 0;
          completed = false;
          setTimeout(function() {
            if (!completed) typeNext();
          }, 400);
        });
      }

      function start() {
        if (started) return;
        started = true;
        index = 0;
        cursorPos = { x: startPos.x, y: startPos.y };
        setCursor(startPos.x, startPos.y);
        typeNext();
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function() { setTimeout(start, 250); });
        setTimeout(start, 1500);
      } else {
        setTimeout(start, 400);
      }
    })();
  </script>
</body>
</html>
