<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>T-Rex Runner High Score</title>
  <meta name="description" content="Check out my T-Rex Runner high score">
  <meta name="theme-color" content="#141413">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23141413'/%3E%3Crect x='10' y='10' width='44' height='44' fill='none' stroke='%23BC9C62' stroke-width='5'/%3E%3Ccircle cx='43' cy='43' r='7' fill='%23BC9C62'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141413;
      --bg-2: #1B1B19;
      --ink: #EDEBE6;
      --dim: #908E86;
      --faint: #5F5D57;
      --accent: #BC9C62;
      --line: rgba(237,235,230,0.08);
      --line-2: rgba(237,235,230,0.22);
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", "Courier New", monospace;
      --sheen-peak: 0.05;
      --scoreglow-peak: 0.11;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .card { width: 100%; max-width: 520px; container-type: inline-size; }
    /* Layer cake: each independently animated element is its own tiny
       absolutely-positioned SVG root, so every transform/opacity animation
       is compositor-driven and repaints only its own small area instead of
       forcing the whole SVG to re-rasterize. One user unit == 1/520 of the
       card width (the card is always 520x260), so px distances in keyframes
       are expressed in cqw (user_value / 5.2). */
    .svg-card {
      position: relative; width: 100%;
      aspect-ratio: 520 / 260; display: block;
      border: 1px solid var(--line-2);
      background: radial-gradient(120% 120% at 50% 0%, var(--bg-2) 0%, var(--bg) 100%);
      box-shadow: 0 40px 80px -60px rgba(188, 156, 98, 0.4);
      overflow: hidden;
    }
    .svg-card > svg, .svg-card > div { position: absolute; display: block; }
    .svg-card svg:not(.ground-layer) { overflow: visible; }

    .bg-layer, .frame-border, .sheen, .sky-dusk, .sky-night, .night-gate, .texts {
      left: 0; top: 0; width: 100%; height: 100%;
    }

    /* geometry (percent of the 520x260 card) */
    .glow-left   { left: -6.53846%; top: 44.61538%; width: 46.15385%; height: 47.69231%; }
    .sheen       { opacity: 0; }
    .night-gate  { left: 60.38462%; top: 6.15385%; width: 36.92308%; height: 49.23077%; }
    .sun         { left: 78.84615%; top: 3.84615%; width: 15.38462%; height: 30.76923%; }
    .cloud-a     { left: 80.19231%; top: 10.38462%; width: 10.57692%; height: 12.69231%; }
    .cloud-b     { left: 60.19231%; top: 20.76923%; width: 13.07692%; height: 14.61538%; }
    .moon        { left: 80.38462%; top: 6.92308%; width: 12.30769%; height: 24.61538%; }
    .ptero       { left: 54.61538%; top: 26.15385%; width: 18.46154%; height: 29.23077%; }
    .cactus-run  { left: 47.30769%; top: 57.69231%; width: 67.30769%; height: 25.38462%; }
    .dino-shadow { left: 68.84615%; top: 81.73077%; width: 10%; height: 2.69231%; }
    .dust-layer  { left: 61.92308%; top: 71.53846%; width: 15%; height: 12.69231%; }
    .glow-scene  { left: 67.30769%; top: 46.92308%; width: 20.76923%; height: 41.53846%; }
    .ground-layer{ left: 57.69231%; top: 80.76923%; width: 42.30769%; height: 6.92308%; overflow: hidden; }

    .ptero > svg, .dino-jump > .dino > svg { position: absolute; display: block; }
    .ptero > svg { left: 0; top: 0; width: 100%; height: 100%; }
    .dino   { position: absolute; inset: 0; }
    .run-a, .run-b { left: 10.71429%; top: 7.27273%; width: 78.57143%; height: 85.45455%; }
    .run-eyes { left: 57.14286%; top: 16.36364%; width: 3.57143%; height: 3.63636%; }

    .play-btn {
      display: block; width: 100%;
      margin-top: 14px; padding: 14px 17px;
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: .16em; text-transform: uppercase;
      color: var(--dim); background: none;
      border: 1px solid var(--line-2);
      text-align: center; text-decoration: none;
      cursor: pointer; user-select: none; -webkit-user-select: none;
      transition: background .2s ease, color .2s ease, border-color .2s ease;
    }
    .play-btn:hover {
      background: var(--ink); color: var(--bg); border-color: var(--ink);
    }

    @keyframes blink {
      0%, 91%, 100% { opacity: 0; }
      93%, 96%      { opacity: 1; }
    }
    @keyframes scoreGlow {
      0%, 100% { opacity: .04; }
      50%      { opacity: var(--scoreglow-peak); }
    }
    @keyframes sheen {
      0%       { transform: translateX(-30.76923cqw); opacity: 0; }
      12%      { opacity: var(--sheen-peak); }
      50%      { opacity: var(--sheen-peak); }
      88%      { opacity: 0; }
      100%     { transform: translateX(107.69231cqw); opacity: 0; }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-0.38462cqw); }
    }
    /* Chrome-run crossfades: two baked sprite frames alternate like the arcade. */
    @keyframes stepA {
      0%, 49.9%  { opacity: 1; }
      50%, 100%  { opacity: 0; }
    }
    @keyframes stepB {
      0%, 49.9%  { opacity: 0; }
      50%, 100%  { opacity: 1; }
    }
    @keyframes drift {
      0%       { transform: translateX(0); opacity: 0; }
      8%       { opacity: .55; }
      78%      { opacity: .55; }
      90%      { transform: translateX(-69.23077cqw); opacity: 0; }
      100%     { transform: translateX(-69.23077cqw); opacity: 0; }
    }
    @keyframes dustKick {
      0%, 6%    { opacity: 0; transform: translate(0, 0) scale(1); }
      9%        { opacity: .5; }
      19%       { opacity: 0; transform: translate(-26px, -8px) scale(.3); }
      21%       { opacity: 0; transform: translate(0, 0) scale(1); }
      24%       { opacity: .4; }
      32%       { opacity: 0; transform: translate(-22px, -6px) scale(.3); }
      34%, 100% { opacity: 0; transform: translate(0, 0) scale(1); }
    }
    @keyframes dustLand {
      0%, 72% { opacity: 0; transform: translate(0, 0) scale(.4); }
      76%     { opacity: .85; transform: translate(-2px, -3px) scale(1.15); }
      100%    { opacity: 0; transform: translate(var(--dx, -24px), var(--dy, -10px)) scale(.15); }
    }
    @keyframes cactusRun {
      0%    { transform: translateX(21.15385cqw); opacity: 0; }
      4%    { opacity: .62; }
      78%   { transform: translateX(-32.69231cqw); opacity: .62; }
      86%   { opacity: 0; }
      100%  { transform: translateX(-40.38462cqw); opacity: 0; }
    }
    @keyframes groundScroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-60px); }
    }
    @keyframes dinoJump {
      0%, 34%   { transform: translateY(0) rotate(0deg) scale(1, 1); }
      37%       { transform: translateY(0.76923cqw) rotate(0deg) scale(1.07, .88);
                  animation-timing-function: cubic-bezier(.3, 0, .9, .5); }
      39%       { transform: translateY(-10cqw) rotate(-3deg) scale(.97, 1.05);
                  animation-timing-function: cubic-bezier(.15, .6, .35, 1); }
      44%       { transform: translateY(-13.46154cqw) rotate(-5deg) scale(1, 1.01); }
      68%       { transform: translateY(-13.46154cqw) rotate(-4deg) scale(1, 1);
                  animation-timing-function: cubic-bezier(.55, .05, .8, .45); }
      72%       { transform: translateY(-5.76923cqw) rotate(-1deg) scale(1, 1.02); }
      74%       { transform: translateY(-0.57692cqw) rotate(0deg) scale(1, 1.01); }
      76%       { transform: translateY(0.76923cqw) rotate(0deg) scale(1.12, .84); }
      80%       { transform: translateY(-0.19231cqw) rotate(0deg) scale(.96, 1.05); }
      85%, 100% { transform: translateY(0) rotate(0deg) scale(1, 1); }
    }
    @keyframes dinoShadow {
      0%, 38%   { opacity: .55; transform: scaleX(1); }
      44%, 68%  { opacity: .12; transform: scaleX(.42); }
      73%       { opacity: .48; transform: scaleX(.88); }
      76%       { opacity: .78; transform: scaleX(1.2); }
      82%, 100% { opacity: .55; transform: scaleX(1); }
    }
    @keyframes speedLine {
      0%   { opacity: 0; transform: translateX(0) scaleX(.3); }
      14%  { opacity: .7; transform: translateX(-3.07692cqw) scaleX(1); }
      62%  { opacity: .28; transform: translateX(-20cqw) scaleX(.85); }
      100% { opacity: 0; transform: translateX(-28.84615cqw) scaleX(.4); }
    }
    @keyframes sunDrift {
      0%    { transform: translate(13.46154cqw, 26.92308cqw); opacity: 0; }
      9%    { transform: translate(9.23077cqw, 11.15385cqw); opacity: .85; }
      27%   { transform: translate(-3.07692cqw, 5cqw); opacity: .95; }
      48%   { transform: translate(-13.46154cqw, 7.69231cqw); opacity: .85; }
      58%   { transform: translate(-20cqw, 20.76923cqw); opacity: .25; }
      63%   { transform: translate(-22.69231cqw, 26.92308cqw); opacity: 0; }
      100%  { transform: translate(-22.69231cqw, 26.92308cqw); opacity: 0; }
    }
    @keyframes duskWash {
      0%, 48%    { opacity: 0; }
      58%        { opacity: .14; }
      68%, 100%  { opacity: 0; }
    }
    @keyframes nightWash {
      0%, 58%    { opacity: 0; }
      70%, 90%   { opacity: .55; }
      99%, 100%  { opacity: 0; }
    }
    @keyframes moonDrift {
      0%, 58% { transform: translate(13.46154cqw, 28.84615cqw); opacity: 0; }
      70%    { transform: translate(5.76923cqw, 8.07692cqw); opacity: .9; }
      84%    { transform: translate(-4.61538cqw, 4.23077cqw); opacity: 1; }
      94%    { transform: translate(-13.46154cqw, 12.69231cqw); opacity: .5; }
      100%   { transform: translate(-16.92308cqw, 20.76923cqw); opacity: 0; }
    }
    @keyframes nightGate {
      0%, 60%   { opacity: 0; }
      70%, 92%  { opacity: 1; }
      99%, 100% { opacity: 0; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: .12; }
      50%      { opacity: .9; }
    }
    @keyframes pteroFly {
      0%    { transform: translate(48.07692cqw, -3.07692cqw); opacity: 0; }
      9%    { transform: translate(40.76923cqw, -1.15385cqw); opacity: .8; }
      55%   { transform: translate(17.69231cqw, 3.07692cqw); opacity: .8; }
      86%   { transform: translate(3.46154cqw, -0.76923cqw); opacity: .8; }
      92%   { transform: translate(1.92308cqw, -1.15385cqw); opacity: 0; }
      100%  { transform: translate(1.92308cqw, -1.15385cqw); opacity: 0; }
    }

    .dino-jump   { left: 62.69231%; top: 43.46154%; width: 21.53846%; height: 42.30769%;
                   transform-origin: 50% 92.72727%;
                   animation: dinoJump 2.6s ease-in-out infinite; }
    .dino        { animation: bob .5s ease-in-out infinite; }
    .dino-shadow { transform-origin: 50% 50%;
                   animation: dinoShadow 2.6s ease-in-out infinite; }
    .run-a       { animation: stepA .42s linear infinite; }
    .run-b       { opacity: 0; animation: stepB .42s linear infinite; }
    .run-eyes    { opacity: 0; animation: blink 6.5s ease-in-out infinite; }
    .cloud       { opacity: .55; animation: drift 9s linear infinite; }
    .ptero       { opacity: .8; animation: pteroFly 12s linear infinite; }
    .flap-a      { animation: stepA .8s linear infinite; }
    .flap-b      { opacity: 0; animation: stepB .8s linear infinite; }
    .sun         { opacity: .85; animation: sunDrift 24s ease-in-out infinite; }
    .moon        { opacity: 0; animation: moonDrift 24s ease-in-out infinite; }
    .night-gate  { opacity: 0; animation: nightGate 24s ease-in-out infinite; }
    .star        { position: absolute; aspect-ratio: 1; border-radius: 50%;
                   background: #EDEBE6; transform: translate(-50%, -50%);
                   opacity: .12; animation: twinkle 3.2s ease-in-out infinite; }
    .sky-dusk    { opacity: 0; animation: duskWash 24s ease-in-out infinite; }
    .sky-night   { opacity: 0; animation: nightWash 24s ease-in-out infinite; }
    .score-glow  { opacity: .15; animation: scoreGlow 6s ease-in-out infinite; }
    .sheen       { animation: sheen 11s ease-in-out infinite; }
    .ground-layer .ground-scroll { animation: groundScroll .435s linear infinite; }
    .cactus-run  { opacity: .62; animation: cactusRun 2.6s linear infinite; }
    .speed-line  { transform-origin: 100% 50%; opacity: 0;
                   animation: speedLine .8s linear infinite; }
    .dust-kick   { transform-box: fill-box; transform-origin: center;
                   animation: dustKick 2.6s linear infinite; }
    .dust-land   { transform-box: fill-box; transform-origin: center;
                   animation: dustLand 2.6s ease-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .dino-jump, .dino, .run-a, .run-b, .flap-a, .flap-b, .run-eyes, .cloud,
      .score-glow, .sheen, .ground-layer .ground-scroll, .cactus-run, .speed-line,
      .sun, .moon, .star, .sky-dusk, .sky-night, .ptero, .night-gate,
      .dino-shadow, .dust-kick, .dust-land { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="svg-card" role="img" aria-label="Dino high score">
      <!-- static backdrop: gradient, grid, ground shadow line -->
      <svg class="bg-layer" viewBox="0 0 520 260">
        <defs>
          <radialGradient id="g" cx="50%" cy="0%" r="120%">
            <stop offset="0%" stop-color="#1F1F1B" stop-opacity="1" />
            <stop offset="100%" stop-color="#141413" stop-opacity="1" />
          </radialGradient>
          <radialGradient id="accentGlow">
            <stop offset="0%" stop-color="#BC9C62" stop-opacity="1" />
            <stop offset="100%" stop-color="#BC9C62" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#EDEBE6" stop-opacity="0" />
            <stop offset="50%" stop-color="#EDEBE6" stop-opacity="1" />
            <stop offset="100%" stop-color="#EDEBE6" stop-opacity="0" />
          </linearGradient>
          <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#EDEBE6" stroke-width="0.5" opacity="0.03" />
          </pattern>
          <linearGradient id="duskFade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#BC9C62" stop-opacity="0" />
            <stop offset="45%" stop-color="#BC9C62" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#BC9C62" stop-opacity="1" />
          </linearGradient>
          <linearGradient id="nightFade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#0A1020" stop-opacity="0" />
            <stop offset="38%" stop-color="#0A1020" stop-opacity="0.35" />
            <stop offset="60%" stop-color="#0A1020" stop-opacity="1" />
            <stop offset="100%" stop-color="#0A1020" stop-opacity="1" />
          </linearGradient>
          <g id="groundTile">
            <rect x="0" y="220" width="16" height="2" opacity=".22" />
            <rect x="24" y="218" width="9" height="2" opacity=".16" />
            <rect x="42" y="221" width="12" height="2" opacity=".26" />
          </g>
        </defs>
        <rect width="520" height="260" fill="url(#g)" />
        <rect width="520" height="260" fill="url(#grid)" opacity="0.08" />
        <rect x="300" y="214" width="212" height="2" fill="#EDEBE6" opacity=".45" />
      </svg>

      <svg class="glow-left score-glow" viewBox="-34 116 240 124">
        <ellipse cx="86" cy="178" rx="120" ry="62" fill="url(#accentGlow)" />
      </svg>

      <svg class="sheen" viewBox="0 0 520 260">
        <rect x="0" y="0" width="90" height="260" fill="url(#sheenGrad)" />
      </svg>

      <svg class="frame-border" viewBox="0 0 520 260">
        <rect x="1" y="1" width="518" height="258" fill="none" stroke="rgba(237,235,230,0.12)" />
      </svg>

      <!-- the scene: scrolling ground, sun/moon day-night cycle, clouds,
           flapjiro the flyer, a cactus rolling in, and the runner.
           sun/moon/stars are background layers painted behind the flyer
           and the runner now. -->
      <svg class="sky-dusk" viewBox="0 0 520 260">
        <rect width="520" height="260" fill="url(#duskFade)" />
      </svg>
      <svg class="sky-night" viewBox="0 0 520 260">
        <rect width="520" height="260" fill="url(#nightFade)" />
      </svg>

      <div class="night-gate">
        <span class="star" style="left:2.08333%;top:15.625%;width:1.35417%;animation-delay:-.4s"></span>
        <span class="star" style="left:19.79167%;top:56.25%;width:1.04167%;animation-delay:-1.9s"></span>
        <span class="star" style="left:34.375%;top:9.375%;width:1.5625%;animation-delay:-1.1s"></span>
        <span class="star" style="left:48.95833%;top:68.75%;width:1.04167%;animation-delay:-2.6s"></span>
        <span class="star" style="left:63.54167%;top:3.125%;width:1.25%;animation-delay:-.8s"></span>
        <span class="star" style="left:80.20833%;top:75%;width:1.45833%;animation-delay:-2.2s"></span>
        <span class="star" style="left:93.75%;top:34.375%;width:1.04167%;animation-delay:-1.5s"></span>
        <span class="star" style="left:97.91667%;top:90.625%;width:1.25%;animation-delay:-3s"></span>
        <span class="star" style="left:11.45833%;top:87.5%;width:1.04167%;animation-delay:-2.9s"></span>
        <span class="star" style="left:42.70833%;top:34.375%;width:1.14583%;animation-delay:-.2s"></span>
        <span class="star" style="left:57.29167%;top:96.875%;width:1.04167%;animation-delay:-1.7s"></span>
        <span class="star" style="left:89.58333%;top:6.25%;width:1.35417%;animation-delay:-2.4s"></span>
      </div>

      <svg class="sun" viewBox="410 10 80 80">
        <circle cx="450" cy="50" r="34" fill="url(#accentGlow)" opacity=".28" />
        <circle cx="450" cy="50" r="13" fill="#EDEBE6" />
        <circle cx="450" cy="50" r="19" fill="none" stroke="#EDEBE6" stroke-width="1" opacity=".2" />
      </svg>

      <svg class="cloud cloud-a" viewBox="417 27 55 33" style="animation-delay:-3s; animation-duration:13s">
        <g fill="#EDEBE6" opacity=".22">
          <circle cx="430" cy="44" r="8" />
          <circle cx="444" cy="40" r="11" />
          <circle cx="459" cy="44" r="9" />
        </g>
      </svg>
      <svg class="cloud cloud-b" viewBox="313 54 68 38">
        <g fill="#EDEBE6" opacity=".28">
          <circle cx="330" cy="76" r="10" />
          <circle cx="346" cy="71" r="13" />
          <circle cx="364" cy="76" r="11" />
        </g>
      </svg>

      <svg class="moon" viewBox="418 18 64 64">
        <circle cx="450" cy="50" r="30" fill="url(#accentGlow)" opacity=".18" />
        <circle cx="450" cy="50" r="12" fill="#EDEBE6" opacity=".92" />
        <circle cx="445" cy="46" r="2.6" fill="#141413" opacity=".55" />
        <circle cx="454" cy="55" r="1.7" fill="#141413" opacity=".45" />
        <circle cx="447" cy="56" r="1.2" fill="#141413" opacity=".4" />
      </svg>

      <div class="ptero">
        <svg class="flap-a" viewBox="284 68 96 76">
          <path fill="rgba(237,235,230,.35)" d="M306 82h8v4h-8zM302 86h4v4h-4zM314 86h4v8h-4zM298 90h4v4h-4zM294 94h4v4h-4zM318 94h4v4h-4zM290 98h4v4h-4zM318 98h28v4h-28zM286 102h4v4h-4zM346 102h4v4h-4zM286 106h28v4h-28zM350 106h28v4h-28zM314 110h4v4h-4zM374 110h4v4h-4zM362 114h12v4h-12zM370 118h4v4h-4zM358 122h12v4h-12zM338 126h20v4h-20zM334 130h4v4h-4zM330 134h4v8h-4zM318 114h4v32h-4zM326 142h4v4h-4zM322 146h4v4h-4z" />
          <path fill="#EDEBE6" d="M306 86h8v4h-8zM302 90h12v4h-12zM298 94h20v4h-20zM294 98h24v4h-24zM290 102h56v4h-56zM314 106h36v4h-36zM318 110h56v4h-56zM322 114h40v4h-40zM322 118h48v4h-48zM322 122h36v4h-36zM322 126h16v4h-16zM322 130h12v4h-12zM322 134h8v8h-8zM322 142h4v4h-4z" />

  <script src="../share-utils.js"></script>
  <script>
    (function () {
      function getParam(name) {
        var url = new URL(window.location.href);
        return url.searchParams.get(name);
      }

      var username = getParam('username') || 'Anonymous';
      var highscore = getParam('highscore') || '0';
      var token = getParam('t');
      if (token) {
        try {
          var data = deobfuscateShare(token);
          if (data && typeof data.n !== "undefined" && typeof data.s !== "undefined") {
            username = String(data.n).slice(0, 60);
            highscore = String(data.s);
          }
        } catch (e) {}
      }
      var userText = document.getElementById('userText');
      var scoreText = document.getElementById('scoreText');
      if (scoreText) {
        var digits = String(highscore).replace(/[^0-9]/g, '') || '0';
        digits = digits.slice(0, 5).padStart(5, '0');
        var target = parseInt(digits, 10) || 0;
        var reduced = window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced || target === 0) {
          scoreText.textContent = digits;
        } else {
          // arcade-style roll-up: the counter races up, then eases into place
          var rollDur = 1600, rollStart = null;
          var rollUp = function (ts) {
            if (rollStart === null) rollStart = ts;
            var p = Math.min(1, (ts - rollStart) / rollDur);
            var eased = 1 - Math.pow(1 - p, 4);
            scoreText.textContent =
              String(Math.round(target * eased)).padStart(5, '0');
            if (p < 1) requestAnimationFrame(rollUp);
          };
          requestAnimationFrame(rollUp);
        }
      }
      if (userText) {
        var boxWidth = 470;
        var baseSize = 22, minSize = 11;
        var fitName = function () {
          var name = username;
          var fontSize = baseSize;
          userText.textContent = name;
          userText.setAttribute('font-size', String(fontSize));
          var guard = 0;
          while (userText.getComputedTextLength() > boxWidth && fontSize > minSize && guard++ < 100) {
            fontSize -= 0.5;
            userText.setAttribute('font-size', String(fontSize));
          }
          if (userText.getComputedTextLength() > boxWidth) {
            // Minimum size reached and the name still overflows.  The display
            // font is proportional, so a fixed per-character width guess is
            // wrong -- wide uppercase glyphs overrun it.  Measure the real
            // rendered width of each candidate until it actually fits.
            var n = name.length, k = 0;
            while (n > 1 && k++ < 200) {
              n -= 1;
              var candidate = name.slice(0, n) + '…';
              userText.textContent = candidate;
              if (userText.getComputedTextLength() <= boxWidth) break;
            }
            userText.textContent = name.slice(0, n) + '…';
          }
        };
        fitName();
        // Re-fit once the webfont really is loaded: measuring before that
        // uses the fallback font, so getComputedTextLength() can lie.
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(fitName);
        }
      }
    })();
  </script>
