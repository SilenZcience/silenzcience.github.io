<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typing Velocity High Score — Silas Kraume</title>
  <meta name="description" content="Typing velocity high score">
  <meta name="theme-color" content="#141413">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23141413'/%3E%3Crect x='10' y='10' width='44' height='44' fill='none' stroke='%23BC9C62' stroke-width='5'/%3E%3Ccircle cx='43' cy='43' r='7' fill='%23BC9C62'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141413;
      --bg-2: #1B1B19;
      --ink: #EDEBE6;
      --dim: #908E86;
      --faint: #5F5D57;
      --accent: #BC9C62;
      --line: rgba(237,235,230,0.08);
      --line-2: rgba(237,235,230,0.22);
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", "Courier New", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .card { width: 100%; max-width: 520px; }
    .svg-card {
      width: 100%; height: auto; display: block;
      border: 1px solid var(--line-2);
      background: radial-gradient(120% 120% at 50% 0%, var(--bg-2) 0%, var(--bg) 100%);
      box-shadow: 0 40px 80px -60px rgba(188, 156, 98, 0.4);
    }

    @keyframes scoreGlow {
      0%, 100% { opacity: .04; }
      50%      { opacity: .11; }
    }
    @keyframes sheen {
      0%       { transform: translateX(-160px); opacity: 0; }
      12%      { opacity: .05; }
      50%      { opacity: .05; }
      88%      { opacity: 0; }
      100%     { transform: translateX(560px); opacity: 0; }
    }
    /* The caret types out two ghost lines at 90ms per character (a brisk
       ~115 WPM sweep), then blinks out and starts over. */
    @keyframes caretRun {
      0%    { transform: translate(0, 0);         opacity: 1; animation-timing-function: steps(43, end); }
      38.7% { transform: translate(361.2px, 0);   opacity: 1; animation-timing-function: step-end; }
      39%   { transform: translate(0, 20px);      opacity: 1; animation-timing-function: steps(40, end); }
      75%   { transform: translate(336px, 20px);  opacity: 1; animation-timing-function: ease-in; }
      87%   { transform: translate(336px, 20px);  opacity: 0; animation-timing-function: step-end; }
      96%   { transform: translate(0, 0);         opacity: 0; }
      100%  { transform: translate(0, 0);         opacity: 1; }
    }
    @keyframes chFlash {
      0%   { fill: #EDEBE6; opacity: 1; }
      6%   { fill: #BC9C62; opacity: .92; }
      25%  { fill: #5F5D57; opacity: .5; }
      100% { fill: #5F5D57; opacity: .5; }
    }

    .score-glow { animation: scoreGlow 6s ease-in-out infinite; }
    .sheen      { animation: sheen 11s ease-in-out infinite; }
    .caret      { animation: caretRun 10s infinite; }
    .ghost      { fill: #5F5D57; }
    .ch         { opacity: .5; animation: chFlash 10s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .score-glow, .sheen, .caret, .ch { animation: none; }
      .ch { opacity: .5; }
    }
  </style>
</head>
<body>

      <defs>

          <stop offset="100%" stop-color="#141413" stop-opacity="1" />
        </radialGradient>
        <radialGradient id="accentGlow">
          <stop offset="0%" stop-color="#BC9C62" stop-opacity="1" />
          <stop offset="100%" stop-color="#BC9C62" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#EDEBE6" stop-opacity="0" />
          <stop offset="50%" stop-color="#EDEBE6" stop-opacity="1" />
          <stop offset="100%" stop-color="#EDEBE6" stop-opacity="0" />
        </linearGradient>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#EDEBE6" stroke-width="0.5" opacity="0.03" />
        </pattern>
        <clipPath id="frame"><rect x="1" y="1" width="518" height="258" /></clipPath>
      </defs>

      <rect width="520" height="260" fill="url(#grid)" opacity="0.08" />

      <ellipse class="score-glow" cx="86" cy="164" rx="120" ry="62" fill="url(#accentGlow)" />

      <g clip-path="url(#frame)">
        <rect class="sheen" x="0" y="0" width="90" height="260" fill="url(#sheenGrad)" />
      </g>

      <rect x="1" y="1" width="518" height="258" fill="none" stroke="rgba(237,235,230,0.12)" />

      <text x="32" y="104" font-family="var(--font-mono)" font-size="14" class="ghost"><tspan class="ch" style="animation-delay:0.00">t</tspan><tspan class="ch" style="animation-delay:0.09">h</tspan><tspan class="ch" style="animation-delay:0.18">e</tspan><tspan class="ch" style="animation-delay:0.27">&#160;</tspan><tspan class="ch" style="animation-delay:0.36">q</tspan><tspan class="ch" style="animation-delay:0.45">u</tspan><tspan class="ch" style="animation-delay:0.54">i</tspan><tspan class="ch" style="animation-delay:0.63">c</tspan><tspan class="ch" style="animation-delay:0.72">k</tspan><tspan class="ch" style="animation-delay:0.81">&#160;</tspan><tspan class="ch" style="animation-delay:0.90">b</tspan><tspan class="ch" style="animation-delay:0.99">r</tspan><tspan class="ch" style="animation-delay:1.08">o</tspan><tspan class="ch" style="animation-delay:1.17">w</tspan><tspan class="ch" style="animation-delay:1.26">n</tspan><tspan class="ch" style="animation-delay:1.35">&#160;</tspan><tspan class="ch" style="animation-delay:1.44">f</tspan><tspan class="ch" style="animation-delay:1.53">o</tspan><tspan class="ch" style="animation-delay:1.62">x</tspan><tspan class="ch" style="animation-delay:1.71">&#160;</tspan><tspan class="ch" style="animation-delay:1.80">j</tspan><tspan class="ch" style="animation-delay:1.89">u</tspan><tspan class="ch" style="animation-delay:1.98">m</tspan><tspan class="ch" style="animation-delay:2.07">p</tspan><tspan class="ch" style="animation-delay:2.16">s</tspan><tspan class="ch" style="animation-delay:2.25">&#160;</tspan><tspan class="ch" style="animation-delay:2.34">o</tspan><tspan class="ch" style="animation-delay:2.43">v</tspan><tspan class="ch" style="animation-delay:2.52">e</tspan><tspan class="ch" style="animation-delay:2.61">r</tspan><tspan class="ch" style="animation-delay:2.70">&#160;</tspan><tspan class="ch" style="animation-delay:2.79">t</tspan><tspan class="ch" style="animation-delay:2.88">h</tspan><tspan class="ch" style="animation-delay:2.97">e</tspan><tspan class="ch" style="animation-delay:3.06">&#160;</tspan><tspan class="ch" style="animation-delay:3.15">l</tspan><tspan class="ch" style="animation-delay:3.24">a</tspan><tspan class="ch" style="animation-delay:3.33">z</tspan><tspan class="ch" style="animation-delay:3.42">y</tspan><tspan class="ch" style="animation-delay:3.51">&#160;</tspan><tspan class="ch" style="animation-delay:3.60">d</tspan><tspan class="ch" style="animation-delay:3.69">o</tspan><tspan class="ch" style="animation-delay:3.78">g</tspan></text>
      <text x="32" y="124" font-family="var(--font-mono)" font-size="14" class="ghost"><tspan class="ch" style="animation-delay:3.90">p</tspan><tspan class="ch" style="animation-delay:3.99">a</tspan><tspan class="ch" style="animation-delay:4.08">c</tspan><tspan class="ch" style="animation-delay:4.17">k</tspan><tspan class="ch" style="animation-delay:4.26">&#160;</tspan><tspan class="ch" style="animation-delay:4.35">m</tspan><tspan class="ch" style="animation-delay:4.44">y</tspan><tspan class="ch" style="animation-delay:4.53">&#160;</tspan><tspan class="ch" style="animation-delay:4.62">b</tspan><tspan class="ch" style="animation-delay:4.71">o</tspan><tspan class="ch" style="animation-delay:4.80">x</tspan><tspan class="ch" style="animation-delay:4.89">&#160;</tspan><tspan class="ch" style="animation-delay:4.98">w</tspan><tspan class="ch" style="animation-delay:5.07">i</tspan><tspan class="ch" style="animation-delay:5.16">t</tspan><tspan class="ch" style="animation-delay:5.25">h</tspan><tspan class="ch" style="animation-delay:5.34">&#160;</tspan><tspan class="ch" style="animation-delay:5.43">f</tspan><tspan class="ch" style="animation-delay:5.52">i</tspan><tspan class="ch" style="animation-delay:5.61">v</tspan><tspan class="ch" style="animation-delay:5.70">e</tspan><tspan class="ch" style="animation-delay:5.79">&#160;</tspan><tspan class="ch" style="animation-delay:5.88">d</tspan><tspan class="ch" style="animation-delay:5.97">o</tspan><tspan class="ch" style="animation-delay:6.06">z</tspan><tspan class="ch" style="animation-delay:6.15">e</tspan><tspan class="ch" style="animation-delay:6.24">n</tspan><tspan class="ch" style="animation-delay:6.33">&#160;</tspan><tspan class="ch" style="animation-delay:6.42">l</tspan><tspan class="ch" style="animation-delay:6.51">i</tspan><tspan class="ch" style="animation-delay:6.60">q</tspan><tspan class="ch" style="animation-delay:6.69">u</tspan><tspan class="ch" style="animation-delay:6.78">o</tspan><tspan class="ch" style="animation-       <rect class="caret" x="32" y="93" width="2" height="14" fill="#BC9C62" />

      <text x="32" y="48" font-family="var(--font-mono)" font-size="10" letter-spacing="0.18em" text-transform="uppercase" fill="#908E86">Laboratory · Lab 05</text>
      <text x="32" y="78" font-family="var(--font-display)" font-size="24" font-weight="400" fill="#EDEBE6">Typing Velocity High Score</text>
      <text x="32" y="138" font-family="var(--font-mono)" font-size="11" letter-spacing="0.16em" text-transform="uppercase" fill="#908E86">WPM</text>
      <text id="scoreText" x="32" y="180" font-family="var(--font-mono)" font-size="52" font-weight="500" letter-spacing="0.08em" fill="#EDEBE6">000</text>
      <text x="152" y="138" font-family="var(--font-mono)" font-size="11" letter-spacing="0.16em" text-transform="uppercase" fill="#908E86">Accuracy</text>

      <text x="260" y="138" font-family="var(--font-mono)" font-size="11" letter-spacing="0.16em" text-transform="uppercase" fill="#908E86">Player</text>
      <text id="userText" x="260" y="170" font-family="var(--font-display)" font-weight="300" fill="#BC9C62" text-anchor="start" dominant-baseline="middle">Anonymous</text>
      <text x="32" y="222" font-family="var(--font-mono)" font-size="10" letter-spacing="0.18em" text-transform="uppercase" fill="#5F5D57">silenzcience.github.io · type</text>
    </svg>
  </main>

  <script src="../share-utils.js"></script>
  <script>
    (function () {
      function getParam(name) {
        var url = new URL(window.location.href);
        return url.searchParams.get(name);
      }

      var username = getParam('username') || 'Anonymous';
      var highscore = getParam('highscore') || '0';
      var accuracy = getParam('accuracy') || '';
      var token = getParam('t');
      if (token) {
        try {
          var data = deobfuscateShare(token);
          if (data && typeof data.n !== "undefined" && typeof data.s !== "undefined") {
            username = String(data.n).slice(0, 60);
            highscore = String(data.s);
            if (typeof data.a !== "undefined") accuracy = String(data.a);
          }
        } catch (e) {}
      }
      var userText = document.getElementById('userText');
      var scoreText = document.getElementById('scoreText');
      var accText = document.getElementById('accText');
      if (scoreText) {
        var digits = String(highscore).replace(/[^0-9]/g, '') || '0';
        scoreText.textContent = String(parseInt(digits, 10)).padStart(3, '0');
      }
      if (accText) {
        var apct = String(accuracy).replace(/[^0-9]/g, '');
        accText.textContent = apct ? Math.min(100, parseInt(apct, 10)) + '%' : '—';
        var aSize = 22;
        var aBox = 96;
        accText.setAttribute('font-size', String(aSize));
        var g2 = 0;
        while (accText.getComputedTextLength() > aBox && aSize > 12 && g2++ < 50) {
          aSize -= 0.5;
          accText.setAttribute('font-size', String(aSize));
        }
      }
      if (userText) {
        userText.textContent = username;
        var baseSize = 22;
        var minSize = 11;
        var fontSize = baseSize;
        var boxWidth = 230;
        userText.setAttribute('font-size', String(fontSize));
        var guard = 0;
        while (userText.getComputedTextLength() > boxWidth && fontSize > minSize && guard++ < 100) {
          fontSize -= 0.5;
          userText.setAttribute('font-size', String(fontSize));
        }
        if (userText.getComputedTextLength() > boxWidth && fontSize <= minSize) {
          var maxChars = Math.floor(boxWidth / (fontSize * 0.55));
          if (username.length > maxChars && maxChars > 1) {
            userText.textContent = username.slice(0, maxChars - 1) + '…';
          }
        }
      }
    })();
  </script>
</body>
</html>
