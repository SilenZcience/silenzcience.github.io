  <style>
    :root {
      --bg: #141413;
      --bg-2: #1B1B19;
      --ink: #EDEBE6;
      --dim: #908E86;
      --faint: #5F5D57;
      --accent: #BC9C62;
      --line: rgba(237,235,230,0.08);
      --line-2: rgba(237,235,230,0.22);
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", "Courier New", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .card { width: 100%; max-width: 520px; }
    .svg-card {
      width: 100%; height: auto; display: block;
      border: 1px solid var(--line-2);
      background: radial-gradient(120% 120% at 50% 0%, var(--bg-2) 0%, var(--bg) 100%);
      box-shadow: 0 40px 80px -60px rgba(188, 156, 98, 0.4);
    }
    .play-btn {
      display: block; width: 100%;
      margin-top: 14px; padding: 14px 17px;
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: .16em; text-transform: uppercase;
      color: var(--dim); background: none;
      border: 1px solid var(--line-2);
      text-align: center; text-decoration: none;
      cursor: pointer; user-select: none; -webkit-user-select: none;
      transition: background .2s ease, color .2s ease, border-color .2s ease;
    }
    .play-btn:hover {
      background: var(--ink); color: var(--bg); border-color: var(--ink);
    }

    @keyframes scoreGlow {
      0%, 100% { opacity: .04; }
      50%      { opacity: .11; }
    }
    @keyframes sheen {
      0%       { transform: translateX(-160px); opacity: 0; }
      12%      { opacity: .05; }
      50%      { opacity: .05; }
      88%      { opacity: 0; }
      100%     { transform: translateX(560px); opacity: 0; }
    }
    /* The caret types out four ghost console-buffer lines at 90ms per
       character, then blinks out and starts over. */
    @keyframes caretRun {
      0%    { transform: translate(0, 0);          opacity: 1; animation-timing-function: steps(23, end); }
      18.8% { transform: translate(193.2px, 0);    opacity: 1; animation-timing-function: step-end; }
      19%   { transform: translate(0, 16px);       opacity: 1; animation-timing-function: steps(28, end); }
      41.7% { transform: translate(235.2px, 16px); opacity: 1; animation-timing-function: step-end; }
      42%   { transform: translate(0, 32px);       opacity: 1; animation-timing-function: steps(28, end); }
      64.6% { transform: translate(235.2px, 32px); opacity: 1; animation-timing-function: step-end; }
      65%   { transform: translate(0, 48px);       opacity: 1; animation-timing-function: steps(26, end); }
      85.9% { transform: translate(218.4px, 48px); opacity: 1; }
      92%   { transform: translate(218.4px, 48px); opacity: 0; animation-timing-function: step-end; }
      97%   { transform: translate(0, 0);          opacity: 0; }
      100%  { transform: translate(0, 0);          opacity: 1; }
    }
    @keyframes chFlash {
      0%   { fill: #EDEBE6; opacity: 1; }
      4%   { fill: #BC9C62; opacity: .95; }
      15%  { fill: #5F5D57; opacity: .5; }
      100% { fill: #5F5D57; opacity: .5; }
    }

    .score-glow { animation: scoreGlow 6s ease-in-out infinite; }
    .sheen      { animation: sheen 11s ease-in-out infinite; }
    .caret      { animation: caretRun 11s infinite; }
    .ghost      { fill: #5F5D57; }
    .ch         { opacity: .5; animation: chFlash 11s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .score-glow, .sheen, .caret, .ch { animation: none; }
      .ch { opacity: .5; }
    }
  </style>

  <script src="../share-utils.js"></script>
  <script>
    (function () {
      function getParam(name) {
        var url = new URL(window.location.href);
        return url.searchParams.get(name);
      }

      var username = getParam('username') || 'Anonymous';
      var highscore = getParam('highscore') || '0';
      var accuracy = getParam('accuracy') || '';
      var token = getParam('t');
      if (token) {
        try {
          var data = deobfuscateShare(token);
          if (data && typeof data.n !== "undefined" && typeof data.s !== "undefined") {
            username = String(data.n).slice(0, 60);
            highscore = String(data.s);
            if (typeof data.a !== "undefined") accuracy = String(data.a);
          }
        } catch (e) {}
      }
      var userText = document.getElementById('userText');
      var scoreText = document.getElementById('scoreText');
      var accText = document.getElementById('accText');
      if (scoreText) {
        var digits = String(highscore).replace(/[^0-9]/g, '') || '0';
        scoreText.textContent = String(parseInt(digits, 10)).padStart(3, '0');
      }
      if (accText) {
        var apct = String(accuracy).replace(/[^0-9]/g, '');
        accText.textContent = apct ? Math.min(100, parseInt(apct, 10)) + '%' : '—';
        var aSize = 22;
        var aBox = 96;
        accText.setAttribute('font-size', String(aSize));
        var g2 = 0;
        while (accText.getComputedTextLength() > aBox && aSize > 12 && g2++ < 50) {
          aSize -= 0.5;
          accText.setAttribute('font-size', String(aSize));
        }
      }
      if (userText) {
        var boxWidth = 380;
        var baseSize = 22, minSize = 11;
        var fitName = function () {
          var name = username;
          var fontSize = baseSize;
          userText.textContent = name;
          userText.setAttribute('font-size', String(fontSize));
          var guard = 0;
          while (userText.getComputedTextLength() > boxWidth && fontSize > minSize && guard++ < 100) {
            fontSize -= 0.5;
            userText.setAttribute('font-size', String(fontSize));
          }
          if (userText.getComputedTextLength() > boxWidth) {
            // Minimum size reached and the name still overflows.  The display
            // font is proportional, so a fixed per-character width guess is
            // wrong -- wide uppercase glyphs overrun it.  Measure the real
            // rendered width of each candidate until it actually fits.
            var n = name.length, k = 0;
            while (n > 1 && k++ < 200) {
              n -= 1;
              var candidate = name.slice(0, n) + '…';
              userText.textContent = candidate;
              if (userText.getComputedTextLength() <= boxWidth) break;
            }
            userText.textContent = name.slice(0, n) + '…';
          }
        };
        fitName();
        // Re-fit once the webfont really is loaded: measuring before that
        // uses the fallback font, so getComputedTextLength() can lie.
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(fitName);
        }
      }
    })();
  </script>
